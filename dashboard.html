    function createListItem(task, section) {
      const item = document.createElement('div');
      item.className = 'list-item';
      item.draggable = true;
      item.dataset.taskId = task.id;

      item.addEventListener('dragstart', (e) => {
        item.classList.add('dragging');
        e.dataTransfer.setData('text/plain', task.id);
        e.dataTransfer.effectAllowed = 'move';
      });

      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        document.querySelectorAll('.list-drop-indicator').forEach(el => el.remove());
        document.querySelectorAll('.list-section.drag-over').forEach(el => el.classList.remove('drag-over'));
      });

      const checkbox = document.createElement('span');
      checkbox.className = `checkbox ${task.checked ? 'checked' : ''}`;
      checkbox.addEventListener('click', (e) => {
        e.stopPropagation();
        setTaskChecked(task, !task.checked);
        markChanged();
        renderTasks();
      });

      const content = document.createElement('div');
      content.className = 'list-item-content';

      const title = document.createElement('div');
      title.className = `list-item-title ${task.checked ? 'checked' : ''}`;
      title.textContent = task.title;
      title.addEventListener('click', (e) => {
        e.stopPropagation();
        startEditingListItem(title, task);
      });
      content.appendChild(title);

      if (task.note) {
        const note = document.createElement('div');
        note.className = 'list-item-note';
        note.textContent = task.note;
        note.addEventListener('click', (e) => {
          e.stopPropagation();
          startEditingListNote(note, task);
        });
        content.appendChild(note);
      } else {
        const addNote = document.createElement('div');
        addNote.className = 'list-item-note add-note';
        addNote.textContent = '+ Add note';
        addNote.addEventListener('click', (e) => {
          e.stopPropagation();
          startEditingListNote(addNote, task);
        });
        content.appendChild(addNote);
      }

      if (task.subtasks && task.subtasks.length > 0) {
        const subtasksContainer = document.createElement('div');
        subtasksContainer.className = 'list-item-subtasks';

        task.subtasks.forEach((st, idx) => {
          const subtaskEl = document.createElement('div');
          subtaskEl.className = 'list-item-subtask';

          const stCheckbox = document.createElement('span');
          stCheckbox.className = `checkbox ${st.checked ? 'checked' : ''}`;
          stCheckbox.addEventListener('click', (e) => {
            e.stopPropagation();
            st.checked = !st.checked;
            markChanged();
            renderTasks();
          });

          const stText = document.createElement('span');
          stText.textContent = st.text;
          if (st.checked) {
            stText.style.textDecoration = 'line-through';
            stText.style.color = 'var(--text-muted)';
          }
          stText.addEventListener('click', (e) => {
            e.stopPropagation();
            startEditingListSubtask(stText, task, idx);
          });

          subtaskEl.appendChild(stCheckbox);
          subtaskEl.appendChild(stText);
          subtasksContainer.appendChild(subtaskEl);
        });

        content.appendChild(subtasksContainer);
      }

      const addSubtask = document.createElement('div');
      addSubtask.className = 'list-item-add-subtask';
      addSubtask.textContent = '+ Add subtask';
      addSubtask.addEventListener('click', (e) => {
        e.stopPropagation();
        startAddingListSubtask(addSubtask, task);
      });
      content.appendChild(addSubtask);

      const actions = document.createElement('div');
      actions.className = 'list-item-actions';
      actions.innerHTML = '<button title="Delete task">&times;</button>';
      actions.querySelector('button').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTask(task);
      });

      item.appendChild(checkbox);
      item.appendChild(content);
      item.appendChild(actions);

      return item;
    }

            picker.remove();
            document.removeEventListener('click', closeHandler);
          }
        });
      }, 10);
    }

      release:    { label: 'Release',          color: '#2f9e44' },
      advisory:   { label: 'Advisory',         color: '#a61e4d' },
      marketing:  { label: 'Marketing',        color: '#e67700' },
      explorar:   { label: 'Exploratório',     color: '#868e96' },
    };
    const OWNER_META = {
      andre: { label: 'só Andre', color: '#D97757' },
      quant: { label: 'quant: Andre', color: '#7048e8' },
      mixed: { label: 'misto', color: '#fab005' },
      team:  { label: 'delegável', color: '#40c057' },
      '':    { label: 'sem dono', color: '#ced4da' },
    };
    const GROUP_META = {
      platforms: { label: 'Platforms', color: '#343a40' },
      produto:   { label: 'Produto',   color: '#5f3dc4' },
    };
    const TAG_RE = /#([\p{L}\p{N}_\/-]+)/gu;

    function taskTags(task) {
      return [...(task.note || '').matchAll(TAG_RE)].map(m => m[1].toLowerCase());
    }
    function taskCategory(task) {
      return taskTags(task).find(t => !FLAG_TAGS.includes(t)) || NO_CATEGORY;
    }
    function taskFlags(task) {
      return taskTags(task).filter(t => FLAG_TAGS.includes(t));
    }
    function taskOwner(task) {
      const n = (task.note || '').toLowerCase();
      if (/\[quant[^\]]*\]/.test(n)) return 'quant';
      if (/\[só andre[^\]]*\]/.test(n)) return 'andre';
      if (/\[misto\]/.test(n)) return 'mixed';
      if (/\[delegável\]/.test(n)) return 'team';
      return '';
    }
    function dependsOnAndre(task) {
      return ['andre', 'quant', 'mixed'].includes(taskOwner(task));
    }
    function categoryGroup(cat) {
      return cat.includes('/') ? cat.split('/')[0] : null;
    }
    function groupLabel(group) {
      return GROUP_META[group]?.label || (group.charAt(0).toUpperCase() + group.slice(1));
    }
    function groupColor(group) {
      return GROUP_META[group]?.color || '#495057';
    }
    function categoryShortLabel(cat) {
      if (cat === NO_CATEGORY) return 'Sem categoria';
      return CATEGORY_META[cat]?.label || cat.split('/').pop();
    }
    function categoryLabel(cat) {
      const group = cat === NO_CATEGORY ? null : categoryGroup(cat);
      return group ? groupLabel(group) + ' / ' + categoryShortLabel(cat) : categoryShortLabel(cat);
    }
    function categoryColor(cat) {
      if (CATEGORY_META[cat]) return CATEGORY_META[cat].color;
      if (cat === NO_CATEGORY) return '#adb5bd';
      let h = 0;
      for (const c of cat) h = (h * 31 + c.charCodeAt(0)) % 360;
      return `hsl(${h}, 55%, 45%)`;
    }
    function cleanNote(note) {
      return (note || '').replace(TAG_RE, '').replace(/\[[^\]]*\]/g, '')
        .replace(/\s+/g, ' ').replace(/^[\s,;-]+|[\s,;-]+$/g, '').trim();
    }
    function taskPills(task) {
      const cat = taskCategory(task);
      const owner = taskOwner(task);
      let html = '';
      taskFlags(task).forEach(f => { html += `<span class="flag-pill">${escapeHtml(f)}</span>`; });
      if (cat !== NO_CATEGORY) html += `<span class="cat-pill" style="background:${categoryColor(cat)}">${escapeHtml(categoryLabel(cat))}</span>`;
      if (owner) html += `<span class="owner-pill ${owner}">${OWNER_META[owner].label}</span>`;
      return html;
    }
    function setTaskFlag(task, flag, on) {
      let note = (task.note || '').replace(new RegExp('\\s*#' + flag + '(?![\\p{L}\\p{N}_/-])', 'giu'), '');
      if (on) note += ' #' + flag;
      task.note = note.replace(/\s{2,}/g, ' ').trim();
    }
    function setTaskCategory(task, cat) {
      const current = taskCategory(task);
      if (current === cat) return;
      let note = task.note || '';
      if (current !== NO_CATEGORY) {
        note = note.replace(new RegExp('#' + current + '(?![\\p{L}\\p{N}_/-])', 'iu'), cat === NO_CATEGORY ? '' : '#' + cat);
      } else if (cat !== NO_CATEGORY) {
        note = (note + ' #' + cat).trim();
      }
      task.note = note.replace(/\s{2,}/g, ' ').trim();
    }
    function orderedCategories(allTasks) {
      const present = new Set(allTasks.map(taskCategory));
      const known = Object.keys(CATEGORY_META);
      const extra = [...present].filter(c => !CATEGORY_META[c] && c !== NO_CATEGORY).sort();
      const list = [...known, ...extra];
      // keep subcategories of the same group side by side
      const groupOrder = [];
      list.forEach(c => { const g = categoryGroup(c) || c; if (!groupOrder.includes(g)) groupOrder.push(g); });
      const grouped = groupOrder.flatMap(g => list.filter(c => (categoryGroup(c) || c) === g));
      return [...grouped, ...(present.has(NO_CATEGORY) ? [NO_CATEGORY] : [])];
    }
    function isDoneSection(id) { return id === 'done'; }
    // Done e concluída são a mesma coisa: estar na seção Done <=> checkbox [x]
    function ensureDoneSection() {
      if (!sections.some(s => isDoneSection(s.id))) sections.push({ id: 'done', name: 'Done' });
      if (!tasks['done']) tasks['done'] = [];
      return 'done';
    }
    function setTaskSection(task, to, dropIndex = -1) {
      if (task.section !== to) {
        if (isDoneSection(to)) task.prevSection = task.section;
        tasks[task.section] = (tasks[task.section] || []).filter(x => x.id !== task.id);
        task.section = to;
        if (!tasks[to]) tasks[to] = [];
        if (dropIndex >= 0 && dropIndex <= tasks[to].length) tasks[to].splice(dropIndex, 0, task);
        else tasks[to].push(task);
      }
      task.checked = isDoneSection(to);
    }
    function setTaskChecked(task, done) {
      if (done) return setTaskSection(task, ensureDoneSection());
      const back = task.prevSection && !isDoneSection(task.prevSection) && sections.some(s => s.id === task.prevSection)
        ? task.prevSection
        : (sections.find(s => isActiveSection(s.id)) || sections.find(s => !isDoneSection(s.id)) || {}).id;
      if (back) setTaskSection(task, back);
      else task.checked = false;
    }
    // Acerta arquivos editados fora do dashboard: [x] fora de Done vai para Done; tudo em Done fica [x]
    function reconcileDone() {
      let changed = false;
      sections.forEach(sec => (tasks[sec.id] || []).slice().forEach(t => {
        if (isDoneSection(sec.id)) { if (!t.checked) { t.checked = true; changed = true; } }
        else if (t.checked) { setTaskChecked(t, true); changed = true; }
      }));
      return changed;
    }
    function isActiveSection(id) { return id === 'active'; }
    function sortForNow(list) {
      return [...list].sort((a, b) =>
        ((taskScore(b) ?? -1) - (taskScore(a) ?? -1)) ||
        (taskFlags(b).length - taskFlags(a).length) || (dependsOnAndre(b) - dependsOnAndre(a)));
    }

    // ===== Prioridade: colunas i/u/e/por_que do tasks.csv (mapa por título, em memória) =====
    let projectRoot = null;
    let priorities = {};

    function priorityKey(title) { return title.trim().toLowerCase(); }
    function priorityOf(task) { return priorities[priorityKey(task.title)] || null; }
    function priorityScore(p) { return Math.round(200 * (0.5 * p.i + 0.35 * p.u + 0.15 * (6 - p.e))); }
    function taskScore(task) { const p = priorityOf(task); return p ? priorityScore(p) : null; }
    function scoreColor(score) { return score >= 750 ? '#e03131' : score >= 550 ? '#f08c00' : '#868e96'; }

    async function savePriorities() {
      if (!taskFileHandle) { showStatus('Conecte a pasta para salvar o ranking'); return; }
      await writeTasksFile();
    }


    // ===== Mindmap: raiz → frentes → tarefas → sub-itens, estilo MindMeister =====
    const mindmapView = document.getElementById('mindmapView');
    const mmCollapsed = new Set();
    let mmZoom = 1;

    function buildMindmapTree() {
      const visible = sections.filter(sec => !(viewFilters.hideDone && isDoneSection(sec.id)))
        .flatMap(sec => tasks[sec.id] || []).filter(passesFilters);
      const catNode = (cat, label) => ({
        id: 'cat:' + cat, kind: 'cat', cat, label,
        children: sortForNow(visible.filter(t => taskCategory(t) === cat)).map(t => ({
          id: 'task:' + t.title, kind: 'task', cat, task: t,
          children: t.subtasks.map((st, i) => ({ id: 'sub:' + t.title + ':' + i, kind: 'sub', cat, sub: st, children: [] })),
        })),
      });
      const top = [];
      const groups = {};
      orderedCategories(visible).forEach(cat => {
        const g = cat !== NO_CATEGORY ? categoryGroup(cat) : null;
        if (!g) { top.push(catNode(cat, categoryLabel(cat))); return; }
        if (!groups[g]) {
          groups[g] = { id: 'group:' + g, kind: 'group', group: g, label: groupLabel(g), children: [] };
          top.push(groups[g]);
        }
        groups[g].children.push(catNode(cat, categoryShortLabel(cat)));
      });
      return top;
    }

    function mmNodeHtml(node) {
      if (node.kind === 'cat' || node.kind === 'group') return escapeHtml(node.label);
      if (node.kind === 'sub') return escapeHtml(node.sub.text);
      const t = node.task;
      const score = taskScore(t);
      return (score !== null ? `<span class="owner-pill score-pill">${score}</span> ` : '') +
        taskFlags(t).map(f => `<span class="flag-pill">${escapeHtml(f)}</span> `).join('') + escapeHtml(t.title);
    }

    function renderMindmap() {
      mindmapView.innerHTML = '';
      mindmapView.style.display = 'flex';
      buildToolbar(mindmapView, `<span class="mm-zoom"><button data-z="-">−</button><button data-z="0">100%</button><button data-z="+">+</button></span>`);
      mindmapView.querySelectorAll('[data-z]').forEach(b => b.addEventListener('click', () => {
        mmZoom = b.dataset.z === '0' ? 1 : Math.min(2, Math.max(0.4, mmZoom + (b.dataset.z === '+' ? 0.1 : -0.1)));
        canvas.style.transform = `scale(${mmZoom})`;
      }));

      const scroll = document.createElement('div');
      scroll.className = 'mindmap-scroll';
      const canvas = document.createElement('div');
      canvas.className = 'mindmap-canvas';
      canvas.style.transform = `scale(${mmZoom})`;
      scroll.appendChild(canvas);
      mindmapView.appendChild(scroll);

      const cats = buildMindmapTree();
      const all = [];
      const makeEl = (node, side, depth) => {
        const el = document.createElement('div');
        const color = node.kind === 'group' ? groupColor(node.group) : categoryColor(node.cat);
        node.depth = depth;
        el.className = 'mm-node mm-' + node.kind + ' side-' + side;
        if (node.kind === 'task') {
          if (isActiveSection(node.task.section)) el.classList.add('active');
          if (node.task.checked) el.classList.add('done');
          el.title = cleanNote(node.task.note);
        }
        if (node.kind === 'sub' && node.sub.checked) el.classList.add('done');
        if (node.children.length) {
          el.classList.add('has-kids');
          if (mmCollapsed.has(node.id)) el.classList.add('collapsed');
          el.addEventListener('click', () => {
            mmCollapsed.has(node.id) ? mmCollapsed.delete(node.id) : mmCollapsed.add(node.id);
            renderMindmap();
          });
        }
        el.style.setProperty('--mm-color', color);
        el.innerHTML = mmNodeHtml(node);
        canvas.appendChild(el);
        node.el = el; node.side = side; node.color = color;
        all.push(node);
        if (!mmCollapsed.has(node.id)) node.children.forEach(c => makeEl(c, side, depth + 1));
      };

      // Balance branches left/right by size (MindMeister-like)
      const weight = c => 1 + (mmCollapsed.has(c.id) ? 0 : c.children.reduce((n, k) => n + weight(k), 0));
      let lw = 0, rw = 0;
      const left = [], right = [];
      [...cats].sort((a, b) => weight(b) - weight(a)).forEach(c => {
        if (rw <= lw) { right.push(c); rw += weight(c); } else { left.push(c); lw += weight(c); }
      });
      const order = list => cats.filter(c => list.includes(c));

      const root = { kind: 'root', children: [] };
      const rootEl = document.createElement('div');
      rootEl.className = 'mm-node mm-root';
      rootEl.textContent = 'Dashboard';
      canvas.appendChild(rootEl);
      order(right).forEach(c => makeEl(c, 'right', 1));
      order(left).forEach(c => makeEl(c, 'left', 1));

      // Measure
      all.forEach(n => { n.w = n.el.offsetWidth; n.h = n.el.offsetHeight; });
      const rootW = rootEl.offsetWidth, rootH = rootEl.offsetHeight;
      const maxW = depth => Math.max(0, ...all.filter(n => n.depth === depth).map(n => n.w));
      const maxDepth = Math.max(1, ...all.map(n => n.depth));
      const X = { 1: rootW / 2 + 70 };
      for (let d = 2; d <= maxDepth; d++) X[d] = X[d - 1] + maxW(d - 1) + 55;

      const layoutSide = list => {
        let y = 0;
        const place = node => {
          const kids = mmCollapsed.has(node.id) ? [] : node.children;
          if (kids.length) {
            const start = y;
            kids.forEach(place);
            node.cy = (kids[0].cy + kids[kids.length - 1].cy) / 2;
            if (node.cy - node.h / 2 < start) { const d = start - (node.cy - node.h / 2); kids.forEach(k => shift(k, d)); node.cy += d; y += d; }
            y = Math.max(y, node.cy + node.h / 2 + 8);
          } else {
            node.cy = y + node.h / 2;
            y += node.h + (node.kind === 'sub' ? 4 : 8);
          }
        };
        const shift = (n, d) => { n.cy += d; (mmCollapsed.has(n.id) ? [] : n.children).forEach(k => shift(k, d)); };
        list.forEach(c => { place(c); y += 18; });
        const total = y - 18;
        list.forEach(c => shift(c, -total / 2));
        return total;
      };
      const hR = layoutSide(order(right));
      const hL = layoutSide(order(left));

      // Bounds → canvas coordinates
      const pad = 40;
      const halfW = Math.max(...all.map(n => X[n.depth] + n.w), rootW / 2);
      const halfH = Math.max(hR, hL, rootH) / 2;
      const ox = halfW + pad, oy = halfH + pad;
      canvas.style.width = (2 * ox) + 'px';
      canvas.style.height = (2 * oy) + 'px';
      rootEl.style.left = (ox - rootW / 2) + 'px';
      rootEl.style.top = (oy - rootH / 2) + 'px';
      all.forEach(n => {
        n.x = n.side === 'right' ? ox + X[n.depth] : ox - X[n.depth] - n.w;
        n.el.style.left = n.x + 'px';
        n.el.style.top = (oy + n.cy - n.h / 2) + 'px';
      });

      // Connectors
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('width', 2 * ox);
      svg.setAttribute('height', 2 * oy);
      const curve = (x1, y1, x2, y2, color, width) => {
        const dx = (x2 - x1) / 2;
        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', width);
        svg.appendChild(path);
        const dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('cx', x1); dot.setAttribute('cy', y1); dot.setAttribute('r', 3);
        dot.setAttribute('fill', '#fff'); dot.setAttribute('stroke', color); dot.setAttribute('stroke-width', 1.5);
        svg.appendChild(dot);
      };
      const anchorOut = n => n.side === 'right' ? n.x + n.w + 8 : n.x - 8;
      const anchorIn = n => n.side === 'right' ? n.x - 8 : n.x + n.w + 8;
      all.filter(n => n.depth === 1).forEach(c => {
        const rx = c.side === 'right' ? ox + rootW / 2 : ox - rootW / 2;
        curve(rx, oy, anchorIn(c), oy + c.cy, c.color, 2.5);
      });
      all.forEach(n => {
        if (mmCollapsed.has(n.id)) return;
        n.children.forEach(k => curve(anchorOut(n), oy + n.cy, anchorIn(k), oy + k.cy, k.kind === 'cat' ? k.color : n.color, k.kind === 'sub' ? 1.2 : k.kind === 'cat' ? 2 : 1.6));
      });
      canvas.insertBefore(svg, canvas.firstChild);

      // Start centered on the root
      requestAnimationFrame(() => {
        scroll.scrollLeft = ox * mmZoom - scroll.clientWidth / 2;
        scroll.scrollTop = oy * mmZoom - scroll.clientHeight / 2;
      });
    }

    // ===== Ranking: todas as tarefas ordenadas por score =====
    const rankView = document.getElementById('rankView');
    // Frentes desmarcadas no menu de checkboxes (novas frentes aparecem por padrão)
    let rankCatHidden = new Set();
    try { rankCatHidden = new Set(JSON.parse(localStorage.getItem('rankCatHidden') || '[]')); } catch (e) {}
    let rankCatMenuOpen = false;
    function setRankCatHidden(next) {
      rankCatHidden = next;
      try { localStorage.setItem('rankCatHidden', JSON.stringify([...next])); } catch (e) {}
      renderRanking();
    }
    function matchesRankCat(task) {
      return !rankCatHidden.has(taskCategory(task));
    }
    document.addEventListener('click', e => {
      if (rankCatMenuOpen && !e.target.closest('.rank-cat-menu')) {
        rankCatMenuOpen = false;
        document.querySelector('.rank-cat-menu')?.classList.remove('open');
      }
    });

    // Formulário "nova tarefa" do Ranking: cria a tarefa (com o score) no tasks.csv
    let rankAddDraft = null;
    function buildRankAddForm(cats, catOptions) {
      const visible = cats.filter(c => !rankCatHidden.has(c) && c !== NO_CATEGORY);
      const d = rankAddDraft || {
        title: '', cat: visible[0] || cats.find(c => c !== NO_CATEGORY) || NO_CATEGORY,
        section: sections.find(x => isActiveSection(x.id))?.id || sections[0]?.id, i: 3, u: 3, e: 3, why: '', urgent: false,
      };
      rankAddDraft = d;
      const form = document.createElement('form');
      form.className = 'rank-add';
      const nums = field => `<label>${field.toUpperCase()} <select data-f="${field}">${[1, 2, 3, 4, 5].map(n => `<option ${d[field] === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>`;
      form.innerHTML = `
        <span class="rank-add-label">+ Nova tarefa</span>
        <input data-f="title" class="rank-add-title" placeholder="Título da tarefa" value="${escapeHtml(d.title)}">
        <select data-f="cat" class="rank-cat-edit" style="background:${categoryColor(d.cat)}">${catOptions(d.cat)}</select>
        <select data-f="section">${sections.map(x => `<option value="${escapeHtml(x.id)}" ${x.id === d.section ? 'selected' : ''}>${escapeHtml(x.name)}</option>`).join('')}</select>
        ${nums('i')}${nums('u')}${nums('e')}
        <label><input type="checkbox" data-f="urgent" ${d.urgent ? 'checked' : ''}> urgente</label>
        <input data-f="why" class="rank-add-why" placeholder="Por quê (opcional)" value="${escapeHtml(d.why)}">
        <button type="submit" class="primary">Adicionar</button>`;
      form.querySelectorAll('[data-f]').forEach(el => el.addEventListener(el.tagName === 'INPUT' && el.type !== 'checkbox' ? 'input' : 'change', async () => {
        const f = el.dataset.f;
        if (f === 'cat' && el.value === '__new__') {
          const typed = prompt('Nova frente (ex.: produto/pricing ou marketing):', '');
          const next = (typed || '').trim().toLowerCase().replace(/^#/, '').replace(/\s+/g, '-');
          if (next) d.cat = next;
          renderRanking();
          return;
        }
        d[f] = el.type === 'checkbox' ? el.checked : ['i', 'u', 'e'].includes(f) ? +el.value : el.value;
        if (f === 'cat') el.style.background = categoryColor(d.cat);
      }));
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const title = d.title.replace(/\s+/g, ' ').trim();
        if (!title) { form.querySelector('.rank-add-title').focus(); return; }
        if (priorities[priorityKey(title)] || sections.some(x => (tasks[x.id] || []).some(t => priorityKey(t.title) === priorityKey(title)))) {
          showStatus('Já existe uma tarefa com esse título');
          return;
        }
        const task = { id: Date.now() + Math.random(), title, note: '', checked: isDoneSection(d.section), subtasks: [], section: d.section };
        setTaskCategory(task, d.cat);
        if (d.urgent) setTaskFlag(task, 'urgente', true);
        tasks[d.section].push(task);
        priorities[priorityKey(title)] = { title, i: d.i, u: d.u, e: d.e, why: d.why.trim() };
        rankAddDraft = { ...d, title: '', why: '', urgent: false };
        markChanged();
        await savePriorities();
        renderTasks();
        rankView.querySelector('.rank-add-title')?.focus();
      });
      return form;
    }

    // Subtarefas abertas no Ranking (por título, pois o id muda a cada leitura do arquivo)
    const rankSubsOpen = new Set();
    let rankSubFocus = null;
    function rankSubsHtml(t) {
      const key = priorityKey(t.title);
      const n = t.subtasks.length;
      const done = t.subtasks.filter(st => st.checked).length;
      // Subtarefas existentes ficam sempre visíveis; "+ subtarefa" abre o campo nas tasks que ainda não têm
      const adding = rankSubsOpen.has(key);
      const open = n > 0 || adding;
      let html = n
        ? `<span class="rank-subs-count">${done}/${n} subtarefa${n > 1 ? 's' : ''}</span>`
        : `<span class="rank-subs-toggle ${adding ? '' : 'empty'}" tabindex="0">${adding ? '× fechar' : '+ subtarefa'}</span>`;
      if (open) {
        html += '<div class="rank-subs">' + t.subtasks.map((st, idx) => `
          <div class="rank-sub ${st.checked ? 'checked' : ''}">
            <input type="checkbox" data-sub-check="${idx}" ${st.checked ? 'checked' : ''}>
            <span class="rank-sub-text" contenteditable="true" spellcheck="false" data-sub-text="${idx}" title="Clique para editar; apague o texto para remover">${escapeHtml(st.text)}</span>
            <button class="rank-sub-del" data-sub-del="${idx}" title="Remover subtarefa">×</button>
          </div>`).join('') +
          `<input class="rank-sub-add ${n && !adding ? 'on-hover' : ''}" data-key="${escapeHtml(key)}" placeholder="Nova subtarefa… (Enter adiciona)"></div>`;
      }
      return html;
    }
    function bindRankSubs(tr, t) {
      const key = priorityKey(t.title);
      const toggle = tr.querySelector('.rank-subs-toggle');
      const flip = () => {
        rankSubsOpen.has(key) ? rankSubsOpen.delete(key) : rankSubsOpen.add(key);
        if (rankSubsOpen.has(key)) rankSubFocus = key;
        renderRanking();
      };
      if (toggle) {
        toggle.addEventListener('click', flip);
        toggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
      }
      tr.querySelectorAll('[data-sub-check]').forEach(box => box.addEventListener('change', () => {
        t.subtasks[+box.dataset.subCheck].checked = box.checked;
        markChanged();
        renderTasks();
      }));
      tr.querySelectorAll('[data-sub-text]').forEach(el => {
        const idx = +el.dataset.subText;
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
          if (e.key === 'Escape') { el.textContent = t.subtasks[idx].text; el.blur(); }
        });
        el.addEventListener('blur', () => {
          const next = el.textContent.replace(/\s+/g, ' ').trim();
          if (next === t.subtasks[idx].text) return;
          if (next) t.subtasks[idx].text = next;
          else t.subtasks.splice(idx, 1);
          markChanged();
          renderTasks();
        });
      });
      tr.querySelectorAll('[data-sub-del]').forEach(btn => btn.addEventListener('click', () => {
        t.subtasks.splice(+btn.dataset.subDel, 1);
        markChanged();
        renderTasks();
      }));
      const add = tr.querySelector('.rank-sub-add');
      if (add) {
        add.addEventListener('keydown', e => {
          if (e.key === 'Escape') { add.value = ''; add.blur(); return; }
          if (e.key !== 'Enter') return;
          e.preventDefault();
          const text = add.value.replace(/\s+/g, ' ').trim();
          if (!text) return;
          t.subtasks.push({ text, checked: false });
          rankSubFocus = key;
          markChanged();
          renderTasks();
        });
      }
    }

    function renderRanking() {
      rankView.innerHTML = '';
      buildToolbar(rankView);
      const legend = document.createElement('div');
      legend.className = 'rank-legend';
      legend.textContent = 'Score = 200 × (0,5·Impacto + 0,35·Urgência + 0,15·(6 − Esforço)), de 0 a 1000. Ajuste I/U/E e o "por quê" aqui mesmo — salva no tasks.csv.';
      rankView.appendChild(legend);

      const cats = orderedCategories(sections.flatMap(sec => tasks[sec.id] || []));
      const visibleCount = cats.filter(c => !rankCatHidden.has(c)).length;
      const menuLabel = visibleCount === cats.length ? 'Todas' : `${visibleCount} de ${cats.length}`;
      let menuItems = '';
      const seenGroups = new Set();
      cats.forEach(cat => {
        const g = cat !== NO_CATEGORY ? categoryGroup(cat) : null;
        if (g && !seenGroups.has(g)) {
          seenGroups.add(g);
          menuItems += `<label class="group"><input type="checkbox" data-group="${escapeHtml(g)}"> ${escapeHtml(groupLabel(g))}</label>`;
        }
        menuItems += `<label class="${g ? 'sub' : ''}"><input type="checkbox" data-cat="${escapeHtml(cat)}" ${rankCatHidden.has(cat) ? '' : 'checked'}><i style="background:${categoryColor(cat)}"></i>${escapeHtml(g ? categoryShortLabel(cat) : categoryLabel(cat))}</label>`;
      });
      const catMenu = `<span class="rank-cat-menu ${rankCatMenuOpen ? 'open' : ''}">
          <button class="rank-cat-toggle ${visibleCount < cats.length ? 'filtered' : ''}">${menuLabel} ▾</button>
          <div class="rank-cat-pop">
            <div class="rank-cat-actions"><button data-all="1">Todas</button><button data-all="0">Nenhuma</button></div>
            ${menuItems}
          </div>
        </span>`;

      const catOptions = current => cats.filter(c => c !== NO_CATEGORY)
        .map(c => `<option value="${escapeHtml(c)}" ${c === current ? 'selected' : ''}>${escapeHtml(categoryLabel(c))}</option>`).join('') +
        `<option value="${NO_CATEGORY}" ${current === NO_CATEGORY ? 'selected' : ''}>Sem categoria</option>` +
        '<option value="__new__">+ nova frente…</option>';

      const list = sections.filter(sec => !(viewFilters.hideDone && isDoneSection(sec.id)))
        .flatMap(sec => (tasks[sec.id] || []).map(t => ({ t, sec })))
        .filter(({ t }) => passesFilters(t) && matchesRankCat(t))
        .sort((a, b) => ((taskScore(b.t) ?? -1) - (taskScore(a.t) ?? -1)));

      const table = document.createElement('table');
      table.className = 'rank-table';
      table.innerHTML = `<thead><tr><th>#</th><th>Score</th><th>Tarefa</th><th>Frente ${catMenu}</th><th>Dono</th><th>Status</th><th title="Impacto">I</th><th title="Urgência">U</th><th title="Esforço">E</th><th>Por quê</th></tr></thead>`;
      const menu = table.querySelector('.rank-cat-menu');
      menu.querySelector('.rank-cat-toggle').addEventListener('click', () => {
        rankCatMenuOpen = !rankCatMenuOpen;
        menu.classList.toggle('open', rankCatMenuOpen);
      });
      menu.querySelectorAll('input[data-group]').forEach(box => {
        const subs = cats.filter(c => c !== NO_CATEGORY && categoryGroup(c) === box.dataset.group);
        const shown = subs.filter(c => !rankCatHidden.has(c)).length;
        box.checked = shown === subs.length;
        box.indeterminate = shown > 0 && shown < subs.length;
        box.addEventListener('change', () => {
          const next = new Set(rankCatHidden);
          subs.forEach(c => box.checked ? next.delete(c) : next.add(c));
          setRankCatHidden(next);
        });
      });
      menu.querySelectorAll('input[data-cat]').forEach(box => box.addEventListener('change', () => {
        const next = new Set(rankCatHidden);
        box.checked ? next.delete(box.dataset.cat) : next.add(box.dataset.cat);
        setRankCatHidden(next);
      }));
      menu.querySelectorAll('[data-all]').forEach(btn => btn.addEventListener('click', () => {
        setRankCatHidden(btn.dataset.all === '1' ? new Set() : new Set(cats));
      }));
      const tbody = document.createElement('tbody');
      list.forEach(({ t, sec }, idx) => {
        const p = priorityOf(t);
        const score = p ? priorityScore(p) : null;
        const cat = taskCategory(t);
        const owner = taskOwner(t);
        const urgent = taskFlags(t).includes('urgente');
        const tr = document.createElement('tr');
        if (t.checked) tr.className = 'done';
        const sel = (field) => `<select data-field="${field}">${p ? '' : '<option value="">–</option>'}${[1, 2, 3, 4, 5].map(n => `<option ${p && p[field] === n ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
        tr.innerHTML = `
          <td class="rank-num">${idx + 1}</td>
          <td><div class="rank-score">${score ?? '–'}<div class="bar"><div style="width:${(score ?? 0) / 10}%;background:${scoreColor(score ?? 0)}"></div></div></div></td>
          <td><div class="rank-title" style="--cat-color:${categoryColor(cat)}"><button class="rank-flag ${urgent ? 'on' : ''}" title="${urgent ? 'Desmarcar urgente' : 'Marcar como urgente'}">${urgent ? 'urgente' : '⚑'}</button><button class="rank-del" title="Excluir tarefa (e o score dela)">🗑</button><span class="rank-title-text" contenteditable="true" spellcheck="false" title="Clique para editar">${escapeHtml(t.title)}</span></div>${rankSubsHtml(t)}</td>
          <td><select class="rank-cat-edit" title="Mudar a frente" style="background:${categoryColor(cat)}">${catOptions(cat)}</select></td>
          <td>${owner ? `<span class="owner-pill ${owner}">${OWNER_META[owner].label}</span>` : ''}</td>
          <td><select class="rank-status-edit" title="Mudar o status">${sections.map(x => `<option value="${escapeHtml(x.id)}" ${x.id === sec.id ? 'selected' : ''}>${escapeHtml(x.name)}</option>`).join('')}</select></td>
          <td>${sel('i')}</td><td>${sel('u')}</td><td>${sel('e')}</td>
          <td><div class="rank-why" contenteditable="true">${escapeHtml(p?.why || '')}</div></td>`;
        const ensure = () => {
          const key = priorityKey(t.title);
          if (!priorities[key]) priorities[key] = { title: t.title, i: 3, u: 3, e: 3, why: '' };
          return priorities[key];
        };
        tr.querySelectorAll('select').forEach(selEl => selEl.addEventListener('change', async () => {
          if (!selEl.value) return;
          ensure()[selEl.dataset.field] = +selEl.value;
          await savePriorities();
          renderTasks();
        }));
        tr.querySelector('.rank-status-edit').addEventListener('change', e => {
          const to = e.target.value;
          if (to === t.section) return;
          setTaskSection(t, to);
          markChanged();
          renderTasks();
        });
        tr.querySelector('.rank-flag').addEventListener('click', () => {
          setTaskFlag(t, 'urgente', !urgent);
          markChanged();
          renderTasks();
        });
        bindRankSubs(tr, t);
        tr.querySelector('.rank-del').addEventListener('click', async () => {
          const subs = t.subtasks.length ? ` e ${t.subtasks.length} subtarefa${t.subtasks.length > 1 ? 's' : ''}` : '';
          if (!confirm(`Excluir "${t.title}"${subs}?\n\nSai do tasks.csv, junto com o score.`)) return;
          tasks[t.section] = (tasks[t.section] || []).filter(x => x.id !== t.id);
          rankSubsOpen.delete(priorityKey(t.title));
          markChanged();
          if (priorities[priorityKey(t.title)]) {
            delete priorities[priorityKey(t.title)];
            await savePriorities();
          }
          renderTasks();
          showStatus(`Excluída: ${t.title}`);
        });
        const titleEl = tr.querySelector('.rank-title-text');
        titleEl.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
          if (e.key === 'Escape') { titleEl.textContent = t.title; titleEl.blur(); }
        });
        titleEl.addEventListener('blur', async () => {
          const next = titleEl.textContent.replace(/\s+/g, ' ').trim();
          if (!next || next === t.title) { titleEl.textContent = t.title; return; }
          const oldKey = priorityKey(t.title);
          const entry = priorities[oldKey];
          if (rankSubsOpen.delete(oldKey)) rankSubsOpen.add(priorityKey(next));
          t.title = next;
          if (entry) {
            delete priorities[oldKey];
            entry.title = next;
            priorities[priorityKey(next)] = entry;
            await savePriorities();
          }
          markChanged();
          renderTasks();
        });
        tr.querySelector('.rank-cat-edit').addEventListener('change', e => {
          let next = e.target.value;
          if (next === '__new__') {
            const typed = prompt('Nova frente (ex.: produto/pricing ou marketing):', '');
            next = (typed || '').trim().toLowerCase().replace(/^#/, '').replace(/\s+/g, '-');
            if (!next) { renderRanking(); return; }
          }
          setTaskCategory(t, next);
          markChanged();
          renderTasks();
        });
        const why = tr.querySelector('.rank-why');
        why.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); why.blur(); } });
        why.addEventListener('blur', async () => {
          const text = why.textContent.trim();
          if ((p?.why || '') === text) return;
          ensure().why = text;
          await savePriorities();
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      rankView.appendChild(buildRankAddForm(cats, catOptions));
      rankView.appendChild(table);
      if (rankSubFocus) {
        const input = [...table.querySelectorAll('.rank-sub-add')].find(x => x.dataset.key === rankSubFocus);
        rankSubFocus = null;
        if (input) input.focus();
      }
    }

    // Shared filters for Tabela/Ranking/Mindmap
    // quick: '' | 'active' | 'mine' | 'team' | 'urgent' (toggled by the stat cards)
    const viewFilters = { quick: '', hideDone: true, minScore: 0 };
    try { viewFilters.minScore = Math.max(0, Math.min(1000, parseInt(localStorage.getItem('minScore'), 10) || 0)); } catch (e) {}
    function setMinScore(v) {
      viewFilters.minScore = Math.max(0, Math.min(1000, Math.round((+v || 0) / 10) * 10));
      try { localStorage.setItem('minScore', String(viewFilters.minScore)); } catch (e) {}
      renderTasks();
    }
    const QUICK_FILTERS = {
      active: t => isActiveSection(t.section),
      mine: t => dependsOnAndre(t),
      team: t => taskOwner(t) === 'team',
      urgent: t => taskFlags(t).length > 0,
    };
    function passesFilters(task) {
      // Score mínimo: tasks sem score somem quando o filtro está ligado
      if (viewFilters.minScore > 0 && (taskScore(task) ?? -1) < viewFilters.minScore) return false;
      if (viewFilters.quick && !QUICK_FILTERS[viewFilters.quick](task)) return false;
      if (viewFilters.hideDone && isDoneSection(task.section)) return false;
      return true;
    }
    function buildToolbar(container, extraStats) {
      const bar = document.createElement('div');
      bar.className = 'view-toolbar';
      const active = (tasks['active'] || []).filter(t => !t.checked);
      const mine = active.filter(dependsOnAndre).length;
      const team = active.filter(t => taskOwner(t) === 'team').length;
      const urgent = active.filter(t => taskFlags(t).length).length;
      const statCard = (key, label, n) =>
        `<span class="stat clickable ${viewFilters.quick === key ? 'on' : ''}" data-q="${key}" title="Clique para filtrar">${label}: <strong>${n}</strong></span>`;
      bar.innerHTML = `
        ${statCard('active', 'Active', active.length)}
        ${statCard('mine', 'dependem de você', mine)}
        ${statCard('team', 'delegáveis', team)}
        ${statCard('urgent', 'urgentes', urgent)}
        ${extraStats || ''}
        <span style="flex:1"></span>
        <span class="score-filter ${viewFilters.minScore ? 'on' : ''}" title="Mostrar só tasks com score a partir deste valor (0 = todas)">
          Score ≥ <input type="range" min="0" max="1000" step="10" value="${viewFilters.minScore}">
          <input type="number" min="0" max="1000" step="10" value="${viewFilters.minScore}">
          ${viewFilters.minScore ? '<button type="button" title="Limpar filtro de score">×</button>' : ''}
        </span>
        <label><input type="checkbox" data-f="hideDone" ${viewFilters.hideDone ? 'checked' : ''}> Ocultar Done</label>`;
      bar.querySelectorAll('[data-q]').forEach(el => el.addEventListener('click', () => {
        viewFilters.quick = viewFilters.quick === el.dataset.q ? '' : el.dataset.q;
        renderTasks();
      }));
      bar.querySelectorAll('input[data-f]').forEach(inp => inp.addEventListener('change', () => {
        viewFilters[inp.dataset.f] = inp.checked;
        renderTasks();
      }));
      const sf = bar.querySelector('.score-filter');
      const range = sf.querySelector('input[type=range]'), num = sf.querySelector('input[type=number]');
      range.addEventListener('input', () => { num.value = range.value; });
      range.addEventListener('change', () => setMinScore(range.value));
      num.addEventListener('keydown', e => { if (e.key === 'Enter') num.blur(); });
      num.addEventListener('change', () => setMinScore(num.value));
      sf.querySelector('button')?.addEventListener('click', () => setMinScore(0));
      container.appendChild(bar);
    }

    // ===== Tabela: linhas = seções, colunas = categorias =====
    const matrixView = document.getElementById('matrixView');
    let matrixDragTask = null;

    function renderMatrix() {
      matrixView.innerHTML = '';
      buildToolbar(matrixView);
      const allTasks = sections.flatMap(sec => tasks[sec.id] || []);
      const cats = orderedCategories(allTasks);
      const rows = sections.filter(sec => !(viewFilters.hideDone && isDoneSection(sec.id)));
      // Active first, so "agora" is always the top row
      rows.sort((a, b) => isActiveSection(b.id) - isActiveSection(a.id));

      const table = document.createElement('table');
      table.className = 'matrix-table';
      const hasGroups = cats.some(c => c !== NO_CATEGORY && categoryGroup(c));
      let head = '<thead>';
      if (hasGroups) {
        head += `<tr class="group-row"><th class="row-head" rowspan="2"></th>`;
        for (let k = 0; k < cats.length;) {
          const g = cats[k] !== NO_CATEGORY ? categoryGroup(cats[k]) : null;
          let span = 1;
          while (g && k + span < cats.length && categoryGroup(cats[k + span]) === g) span++;
          head += g
            ? `<th colspan="${span}" class="group-head" style="--cat-color:${groupColor(g)}">${escapeHtml(groupLabel(g))}</th>`
            : `<th class="group-head empty" style="--cat-color:transparent"></th>`;
          k += span;
        }
        head += '</tr><tr>';
      } else {
        head += '<tr><th class="row-head"></th>';
      }
      cats.forEach(cat => {
        const inCat = allTasks.filter(t => taskCategory(t) === cat && !t.checked);
        const act = inCat.filter(t => isActiveSection(t.section));
        const mine = act.filter(dependsOnAndre).length;
        head += `<th style="--cat-color:${categoryColor(cat)}">
          <div class="matrix-col-title">${escapeHtml(hasGroups ? categoryShortLabel(cat) : categoryLabel(cat))}</div>
          <div class="matrix-col-sub">${act.length} ativas · ${mine} suas · ${inCat.length} abertas</div></th>`;
      });
      table.innerHTML = head + '</tr></thead>';

      const tbody = document.createElement('tbody');
      rows.forEach(sec => {
        const tr = document.createElement('tr');
        const secTasks = (tasks[sec.id] || []).filter(passesFilters);
        tr.innerHTML = `<th class="row-head">${escapeHtml(sec.name)}<div class="matrix-col-sub">${secTasks.length} tarefas</div></th>`;
        cats.forEach(cat => {
          const td = document.createElement('td');
          sortForNow(secTasks.filter(t => taskCategory(t) === cat)).forEach(t => td.appendChild(createMatrixChip(t)));
          const add = document.createElement('div');
          add.className = 'matrix-add';
          add.textContent = '+ nova tarefa';
          add.addEventListener('click', () => startMatrixAdd(add, sec.id, cat));
          td.appendChild(add);
          td.addEventListener('dragover', e => { e.preventDefault(); td.classList.add('drop-target'); });
          td.addEventListener('dragleave', () => td.classList.remove('drop-target'));
          td.addEventListener('drop', e => {
            e.preventDefault();
            td.classList.remove('drop-target');
            if (!matrixDragTask) return;
            const t = matrixDragTask;
            matrixDragTask = null;
            setTaskCategory(t, cat);
            if (t.section !== sec.id) setTaskSection(t, sec.id);
            markChanged();
            renderTasks();
          });
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      matrixView.appendChild(table);
    }

    function startMatrixAdd(addEl, sectionId, cat) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'matrix-add-input';
      input.placeholder = 'Título da tarefa… (Enter salva, Esc cancela)';
      addEl.replaceWith(input);
      input.focus();
      let done = false;
      const finish = save => {
        if (done) return;
        done = true;
        const title = input.value.replace(/\s+/g, ' ').trim();
        if (save && title) {
          tasks[sectionId].push({
            id: Date.now() + Math.random(),
            title,
            note: cat === NO_CATEGORY ? '' : '#' + cat,
            checked: isDoneSection(sectionId),
            subtasks: [],
            section: sectionId,
          });
          markChanged();
        }
        renderTasks();
      };
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        else if (e.key === 'Escape') { finish(false); }
      });
      input.addEventListener('blur', () => finish(true));
    }

    function createMatrixChip(task) {
      const chip = document.createElement('div');
      chip.className = 'matrix-chip' + (task.checked ? ' done' : '');
      chip.draggable = true;
      chip.style.setProperty('--cat-color', categoryColor(taskCategory(task)));
      const note = cleanNote(task.note);
      const subs = task.subtasks.length
        ? '<ul>' + task.subtasks.map(st => `<li>${st.checked ? '✓ ' : ''}${escapeHtml(st.text)}</li>`).join('') + '</ul>' : '';
      const ownerPill = taskOwner(task) ? `<span class="owner-pill ${taskOwner(task)}">${OWNER_META[taskOwner(task)].label}</span>` : '';
      const flags = taskFlags(task).map(f => `<span class="flag-pill">${escapeHtml(f)}</span>`).join('');
      const score = taskScore(task);
      const subCount = task.subtasks.length ? `<span class="owner-pill">${task.subtasks.filter(s => s.checked).length}/${task.subtasks.length}</span>` : '';
      chip.innerHTML = `
        <div class="matrix-chip-head">
          <input type="checkbox" ${task.checked ? 'checked' : ''}>
          <span class="matrix-chip-title">${escapeHtml(task.title)}</span>
        </div>
        ${(flags || ownerPill || subCount || score !== null) ? `<div class="matrix-chip-meta">${score !== null ? `<span class="owner-pill score-pill" title="Score de prioridade">${score}</span>` : ''}${flags}${ownerPill}${subCount}</div>` : ''}
        <div class="matrix-chip-detail">${escapeHtml(note)}${subs}</div>`;
      chip.querySelector('input').addEventListener('change', e => {
        setTaskChecked(task, e.target.checked);
        markChanged();
        renderTasks();
      });
      chip.querySelector('.matrix-chip-title').addEventListener('click', () => chip.classList.toggle('open'));
      chip.addEventListener('dragstart', () => { matrixDragTask = task; });
      chip.addEventListener('dragend', () => { matrixDragTask = null; });
      return chip;
    }

    const matrixViewBtn = document.getElementById('matrixViewBtn');
    const rankViewBtn = document.getElementById('rankViewBtn');
    const mindmapViewBtn = document.getElementById('mindmapViewBtn');

    function switchTaskView(view) {
      const views = {
        board: [board, boardViewBtn, 'flex'],
        list: [listView, listViewBtn, 'block'],
        matrix: [matrixView, matrixViewBtn, 'block'],
        rank: [rankView, rankViewBtn, 'block'],
        mindmap: [mindmapView, mindmapViewBtn, 'flex'],
      };
      if (!views[view]) view = 'board';
      currentView = view;
      Object.entries(views).forEach(([name, [el, btn, display]]) => {
        el.style.display = name === view ? display : 'none';
        btn.classList.toggle('active', name === view);
      });
      try { localStorage.setItem('taskView', view); } catch (e) {}
      renderTasks();
    }

    listViewBtn.addEventListener('click', () => switchTaskView('list'));
    boardViewBtn.addEventListener('click', () => switchTaskView('board'));
    matrixViewBtn.addEventListener('click', () => switchTaskView('matrix'));
    rankViewBtn.addEventListener('click', () => switchTaskView('rank'));
    mindmapViewBtn.addEventListener('click', () => switchTaskView('mindmap'));

    function startAddingSection(btn) {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Section name...';
      input.style.cssText = 'width: 220px; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 8px; padding: 10px 14px; color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none;';

      btn.innerHTML = '';
      btn.style.cssText = 'background: var(--bg-secondary); border: 2px dashed var(--accent); display: flex; align-items: center; justify-content: center; cursor: default; min-height: 120px; min-width: 340px; border-radius: 12px;';
      btn.appendChild(input);
      input.focus();

      let saved = false;
      const saveSection = () => {
        if (saved) return;
        saved = true;
        const name = input.value.trim();
        if (name) {
          const id = taskSectionId(name);
          if (!tasks[id]) {
            sections.push({ id, name });
            tasks[id] = [];
            markChanged();
          }
        }
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveSection(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveSection);
    }

    async function loadTaskHandle(handle) {
      taskFileHandle = handle;
      try {
        const file = await taskFileHandle.getFile();
        const content = await readTasksFile(file);
        lastModified = file.lastModified;
        const fixedDone = applyTasksCsv(content);
        let savedView = 'board';
        try { savedView = localStorage.getItem('taskView') || 'board'; } catch (e) {}
        switchTaskView(savedView);
        startWatching();
        taskFileName = file.name;
        filePathEl.textContent = file.name;
        if (fixedDone) markChanged();
        showStatus('Loaded ' + file.name);
      } catch (e) {
        if (e.name !== 'AbortError') { showStatus('Error: ' + e.message); }
      }
    }

    openTaskBtn.addEventListener('click', connectProject);
    document.getElementById('openBtnLarge')?.addEventListener('click', connectProject);

    saveBtn.addEventListener('click', async () => {
      if (!taskFileHandle) return;
      await writeTasksFile();
    });

    window.addEventListener('beforeunload', (e) => {
      if (hasChanges) { e.preventDefault(); e.returnValue = ''; }
    });

    // ============================================================
    // ===== MEMORY FUNCTIONALITY =====
    // ============================================================

    let memoryDirHandle = null;
    let memoryData = {
      claudeMd: null,
      memoryFiles: [],
      memoryDirs: {}
    };

    const memoryEmptyState = document.getElementById('memoryEmptyState');
    const memoryMainContent = document.getElementById('memoryMainContent');
    const memoryTabsContainer = document.getElementById('memoryTabsContainer');
    const memoryContentContainer = document.getElementById('memoryContentContainer');
    const modalOverlay = document.getElementById('modalOverlay');

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseMemoryMarkdown(content) {
      const parsed = {
        title: '',
        fields: {},
        sections: {},
        tables: [],
        rawContent: content
      };

      const lines = content.split('\n');
      let currentSection = '_intro';
      parsed.sections[currentSection] = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (line.match(/^# /)) {
          parsed.title = line.replace(/^# /, '').trim();
          continue;
        }

        if (line.match(/^## /)) {
          currentSection = line.replace(/^## /, '').trim();
          parsed.sections[currentSection] = [];
          continue;
        }

        const kvMatch = line.match(/^\*\*(.+?):\*\*\s*(.*)$/);
        if (kvMatch) {
          parsed.fields[kvMatch[1]] = kvMatch[2];
          continue;
        }

        parsed.sections[currentSection].push(line);
      }

      for (const key in parsed.sections) {
        parsed.sections[key] = parsed.sections[key].join('\n').trim();
      }

      const tableRegex = /\|(.+)\|\n\|[-| ]+\|\n((?:\|.+\|\n?)+)/g;
      let match;
      while ((match = tableRegex.exec(content)) !== null) {
        const headers = match[1].split('|').map(h => h.trim()).filter(h => h);
        const rowLines = match[2].trim().split('\n');
        const rows = rowLines.map(row => row.split('|').map(c => c.trim()).filter(c => c));
        parsed.tables.push({ headers, rows });
      }

      return parsed;
    }

    function getPreview(content, maxLength = 150) {
      let preview = content
        .replace(/^#+ .+$/gm, '')
        .replace(/\*\*(.+?):\*\*.*/g, '')
        .replace(/\|.+\|/g, '')
        .replace(/[-=]{3,}/g, '')
        .trim()
        .substring(0, maxLength);
      if (content.length > maxLength) preview += '...';
      return preview;
    }

    function getDisplayName(filename) {
      return filename
        .replace('.md', '')
        .split(/[-_]/)
        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    async function loadMemoryDirectory(root) {
      try {
        memoryDirHandle = root;

        memoryData = { claudeMd: null, memoryFiles: [], memoryDirs: {} };

        try {
          const claudeFileHandle = await memoryDirHandle.getFileHandle('CLAUDE.md');
          const file = await claudeFileHandle.getFile();
          memoryData.claudeMd = { content: await file.text(), fileHandle: claudeFileHandle };
        } catch (e) { console.log('No CLAUDE.md found'); }

        try {
          const memoryDir = await getMemoryDir(memoryDirHandle);
          for await (const entry of memoryDir.values()) {
            if (entry.kind === 'file' && entry.name.endsWith('.md')) {
              const file = await entry.getFile();
              memoryData.memoryFiles.push({
                name: entry.name,
                content: await file.text(),
                fileHandle: entry
              });
            } else if (entry.kind === 'directory') {
              memoryData.memoryDirs[entry.name] = [];
              const subDirHandle = entry;
              for await (const subEntry of subDirHandle.values()) {
                if (subEntry.kind === 'file' && subEntry.name.endsWith('.md')) {
                  const file = await subEntry.getFile();
                  const content = await file.text();
                  memoryData.memoryDirs[entry.name].push({
                    name: subEntry.name,
                    content: content,
                    fileHandle: subEntry,
                    dirHandle: subDirHandle,
                    parsed: parseMemoryMarkdown(content)
                  });
                }
              }
            }
          }
        } catch (e) { console.log('No memory/ directory found'); }

        renderMemory();
        memoryEmptyState.style.display = 'none';
        memoryMainContent.style.display = 'flex';
        filePathEl.textContent = memoryDirHandle.name;
        showStatus('Loaded memory from ' + memoryDirHandle.name);

      } catch (e) {
        if (e.name !== 'AbortError') { showStatus('Error: ' + e.message); }
      }
    }

    function renderMemory() {
      renderMemoryTabs();
      renderMemoryContent();
    }

    function renderMemoryTabs() {
      let html = '';

      if (memoryData.claudeMd) {
        html += `<button class="memory-tab active" data-tab="overview">Overview</button>`;
      }

      for (const file of memoryData.memoryFiles) {
        const name = file.name.replace('.md', '');
        html += `<button class="memory-tab${!memoryData.claudeMd && memoryData.memoryFiles[0] === file ? ' active' : ''}" data-tab="file-${escapeHtml(name)}">${escapeHtml(name)}</button>`;
      }

      for (const dirName of Object.keys(memoryData.memoryDirs).sort()) {
        const files = memoryData.memoryDirs[dirName];
        let count;
        if (dirName === 'context') {
          count = 0;
          for (const file of files) {
            const p = file.parsed;
            count += Object.keys(p.fields).length;
            for (const table of p.tables) {
              count += table.rows.length;
            }
            for (const [sName, sContent] of Object.entries(p.sections)) {
              if (sContent && sName !== '_intro') {
                count += sContent.split('\n').filter(l => l.trim() && !l.trim().startsWith('|')).length;
              }
            }
          }
        } else {
          count = files.length;
        }
        html += `<button class="memory-tab" data-tab="dir-${escapeHtml(dirName)}">${escapeHtml(dirName)} <span class="count">${count}</span></button>`;
      }

      memoryTabsContainer.innerHTML = html;

      memoryTabsContainer.querySelectorAll('.memory-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          memoryTabsContainer.querySelectorAll('.memory-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          renderMemoryContent();
        });
      });
    }

    function renderMemoryContent() {
      const activeTab = memoryTabsContainer.querySelector('.memory-tab.active');
      if (!activeTab) return;

      const tabId = activeTab.dataset.tab;

      if (tabId === 'overview') { renderMemoryOverview(); }
      else if (tabId.startsWith('file-')) {
        const fileName = tabId.replace('file-', '') + '.md';
        renderMemoryFile(fileName);
      } else if (tabId.startsWith('dir-')) {
        const dirName = tabId.replace('dir-', '');
        renderMemoryDirectory(dirName);
      }
    }

    function renderMemoryOverview() {
      if (!memoryData.claudeMd) return;

      let statsHtml = '<div class="stats">';
      for (const [dirName, files] of Object.entries(memoryData.memoryDirs)) {
        let count;
        if (dirName === 'context') {
          count = 0;
          for (const file of files) {
            const p = file.parsed;
            count += Object.keys(p.fields).length;
            for (const table of p.tables) { count += table.rows.length; }
            for (const [sName, sContent] of Object.entries(p.sections)) {
              if (sContent && sName !== '_intro') {
                count += sContent.split('\n').filter(l => l.trim() && !l.trim().startsWith('|')).length;
              }
            }
          }
        } else {
          count = files.length;
        }
        statsHtml += `
          <div class="stat">
            <div class="stat-value">${count}</div>
            <div class="stat-label">${escapeHtml(dirName)}</div>
          </div>
        `;
      }
      statsHtml += '</div>';

      const claudeContent = renderMarkdownToHtml(memoryData.claudeMd.content);

      memoryContentContainer.innerHTML = `
        ${statsHtml}
        <div class="file-card">
          <div class="file-card-header" onclick="this.nextElementSibling.classList.toggle('expanded'); this.querySelector('.toggle').textContent = this.nextElementSibling.classList.contains('expanded') ? '\u2212' : '+'">
            <span class="file-card-title">CLAUDE.md</span>
            <span class="toggle" style="color: var(--text-muted);">&minus;</span>
          </div>
          <div class="file-card-content expanded markdown-content">${claudeContent}</div>
        </div>
        <button onclick="openEditModal('CLAUDE.md', 'claudeMd')" style="margin-top: 10px;">Edit CLAUDE.md</button>
      `;
    }

    function renderMemoryFile(fileName) {
      const file = memoryData.memoryFiles.find(f => f.name === fileName);
      if (!file) return;

      const content = renderMarkdownToHtml(file.content);

      memoryContentContainer.innerHTML = `
        <div class="file-card">
          <div class="file-card-header">
            <span class="file-card-title">${escapeHtml(fileName)}</span>
          </div>
          <div class="file-card-content expanded markdown-content">${content}</div>
        </div>
        <button id="editMemoryFileBtn" style="margin-top: 10px;">Edit ${escapeHtml(fileName)}</button>
      `;

      document.getElementById('editMemoryFileBtn').addEventListener('click', () => openEditModal(fileName, 'memoryFile'));
    }

    function renderMemoryDirectory(dirName) {
      const files = memoryData.memoryDirs[dirName] || [];

      // Context directory uses flat list view
      if (dirName === 'context') {
        renderMemoryDirectoryFlat(dirName, files);
        return;
      }

      // All other directories use card grid view
      let html = `
        <div class="search-box">
          <span style="color: var(--text-muted);">&#128269;</span>
          <input type="text" placeholder="Search ${escapeHtml(dirName)}..." id="dirSearch">
        </div>
        <div class="memory-grid" id="dirGrid">
      `;

      for (const file of files) {
        const p = file.parsed;
        const title = p.title || getDisplayName(file.name);

        let fieldsHtml = '';
        const fieldEntries = Object.entries(p.fields).slice(0, 3);
        if (fieldEntries.length > 0) {
          fieldsHtml = '<div class="memory-card-fields">';
          for (const [key, value] of fieldEntries) {
            fieldsHtml += `
              <div class="memory-card-field">
                <span class="memory-card-field-label">${escapeHtml(key)}</span>
                <span class="memory-card-field-value">${escapeHtml(value)}</span>
              </div>
            `;
          }
          fieldsHtml += '</div>';
        }

        let preview = '';
        for (const [sectionName, sectionContent] of Object.entries(p.sections)) {
          if (sectionContent && sectionName !== '_intro') {
            preview = getPreview(sectionContent, 100);
            break;
          }
        }
        if (!preview) preview = getPreview(p.rawContent, 100);

        html += `
          <div class="memory-card" data-file-name="${escapeHtml(file.name)}" data-search="${escapeHtml((title + ' ' + JSON.stringify(p.fields) + ' ' + p.rawContent).toLowerCase())}">
            <div class="memory-card-title">${escapeHtml(title)}</div>
            ${fieldsHtml}
            <div class="memory-card-preview">${escapeHtml(preview)}</div>
          </div>
        `;
      }

      html += `
        <div class="add-btn">
          + Add to ${escapeHtml(dirName)}
        </div>
      </div>`;

      memoryContentContainer.innerHTML = html;

      document.getElementById('dirSearch').addEventListener('input', (e) => filterMemoryDirectory(dirName, e.target.value));
      memoryContentContainer.querySelectorAll('.memory-card').forEach(cardEl => {
        cardEl.addEventListener('click', () => openFileModal(dirName, cardEl.dataset.fileName));
      });
      memoryContentContainer.querySelector('.add-btn').addEventListener('click', () => openNewFileModal(dirName));
    }

    function renderMemoryDirectoryFlat(dirName, files) {
      let html = `
        <div class="search-box">
          <span style="color: var(--text-muted);">&#128269;</span>
          <input type="text" placeholder="Search ${escapeHtml(dirName)}..." id="dirSearch">
        </div>
        <div id="dirGrid">
      `;

      for (const file of files) {
        const p = file.parsed;

        // Render fields as a key-value table
        const fieldEntries = Object.entries(p.fields);
        if (fieldEntries.length > 0) {
          html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><tbody>`;
          for (const [key, value] of fieldEntries) {
            html += `<tr data-search="${escapeHtml((key + ' ' + value).toLowerCase())}"><td>${escapeHtml(key)}</td><td>${escapeHtml(value)}</td></tr>`;
          }
          html += `</tbody></table></div>`;
        }

        // Render parsed tables (teams, tools, etc.) as proper HTML tables
        for (const table of p.tables) {
          html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><thead><tr>`;
          for (const h of table.headers) {
            html += `<th>${escapeHtml(h)}</th>`;
          }
          html += `</tr></thead><tbody>`;
          for (const row of table.rows) {
            const searchData = row.join(' ').toLowerCase();
            html += `<tr data-search="${escapeHtml(searchData)}">`;
            for (const cell of row) {
              html += `<td>${escapeHtml(cell)}</td>`;
            }
            html += `</tr>`;
          }
          html += `</tbody></table></div>`;
        }

        // Render non-table section content as list items
        for (const [sectionName, sectionContent] of Object.entries(p.sections)) {
          if (!sectionContent || sectionName === '_intro') continue;
          const lines = sectionContent.split('\n').filter(l => l.trim() && !l.trim().startsWith('|'));
          if (lines.length === 0) continue;
          html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><thead><tr><th colspan="2">${escapeHtml(sectionName)}</th></tr></thead><tbody>`;
          for (const line of lines) {
            const cleanLine = line.replace(/^[-*]\s*/, '').replace(/\*\*(.+?)\*\*/g, '$1').trim();
            if (!cleanLine) continue;
            html += `<tr data-search="${escapeHtml((sectionName + ' ' + cleanLine).toLowerCase())}"><td colspan="2">${escapeHtml(cleanLine)}</td></tr>`;
          }
          html += `</tbody></table></div>`;
        }
      }

      html += `</div>`;
      memoryContentContainer.innerHTML = html;

      document.getElementById('dirSearch').addEventListener('input', (e) => filterMemoryDirectory(dirName, e.target.value));
    }

    function filterMemoryDirectory(dirName, searchTerm) {
      const grid = document.getElementById('dirGrid');
      const items = grid.querySelectorAll('.memory-card, tr[data-search]');
      const search = searchTerm.toLowerCase();
      items.forEach(item => {
        const searchData = item.dataset.search || '';
        item.style.display = (!search || searchData.includes(search)) ? '' : 'none';
      });
    }

    function renderMarkdownToHtml(md) {
      let html = escapeHtml(md);

      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/```[\s\S]*?```/g, match => {
        const code = match.replace(/```\w*\n?/g, '');
        return '<pre><code>' + code + '</code></pre>';
      });
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/(\|.+\|\n\|[-| ]+\|\n(?:\|.+\|\n?)+)/g, match => {
        const lines = match.trim().split('\n');
        const headers = lines[0].split('|').filter(c => c.trim());
        const rows = lines.slice(2).map(row => row.split('|').filter(c => c.trim()));
        let table = '<table><thead><tr>';
        headers.forEach(h => table += `<th>${h.trim()}</th>`);
        table += '</tr></thead><tbody>';
        rows.forEach(row => {
          table += '<tr>';
          row.forEach(cell => table += `<td>${cell.trim()}</td>`);
          table += '</tr>';
        });
        table += '</tbody></table>';
        return table;
      });
      html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
      html = html.replace(/^(?!<[hupol]|<li|<table|<pre)(.+)$/gm, '<p>$1</p>');
      html = html.replace(/<p><\/p>/g, '');
      html = html.replace(/<p>\s*<\/p>/g, '');

      return html;
    }

    // Modal functions
    function openFileModal(dirName, fileName) {
      const files = memoryData.memoryDirs[dirName];
      const file = files.find(f => f.name === fileName);
      if (!file) return;

      document.getElementById('modalTitle').textContent = getDisplayName(fileName);
      document.getElementById('modalBody').innerHTML = `
        <div class="markdown-content" style="margin-bottom: 20px;">
          ${renderMarkdownToHtml(file.content)}
        </div>
        <div class="form-group">
          <label>Edit Raw Markdown</label>
          <textarea id="editContent">${escapeHtml(file.content)}</textarea>
        </div>
      `;

      modalOverlay.classList.add('visible');
      modalOverlay.dataset.type = 'dirFile';
      modalOverlay.dataset.dirName = dirName;
      modalOverlay.dataset.fileName = fileName;
    }

    function openNewFileModal(dirName) {
      document.getElementById('modalTitle').textContent = `Add to ${dirName}`;

      let template = '# New Entry\n\n';
      const existingFiles = memoryData.memoryDirs[dirName];
      if (existingFiles && existingFiles.length > 0) {
        const sample = existingFiles[0].parsed;
        for (const key of Object.keys(sample.fields)) {
          template += `**${key}:** \n`;
        }
        template += '\n';
        for (const section of Object.keys(sample.sections)) {
          if (section !== '_intro') {
            template += `## ${section}\n\n`;
          }
        }
      }

      document.getElementById('modalBody').innerHTML = `
        <div class="form-group">
          <label>Filename (without .md)</label>
          <input type="text" id="newFileName" placeholder="my-new-entry" style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text-primary); font-size: 14px; font-family: inherit; margin-bottom: 16px;">
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea id="editContent">${escapeHtml(template)}</textarea>
        </div>
      `;

      modalOverlay.classList.add('visible');
      modalOverlay.dataset.type = 'newDirFile';
      modalOverlay.dataset.dirName = dirName;
    }

    function openEditModal(fileName, type) {
      let content = '';
      if (type === 'claudeMd') {
        content = memoryData.claudeMd.content;
      } else if (type === 'memoryFile') {
        const file = memoryData.memoryFiles.find(f => f.name === fileName);
        if (file) content = file.content;
      }

      document.getElementById('modalTitle').textContent = `Edit ${fileName}`;
      document.getElementById('modalBody').innerHTML = `
        <div class="form-group">
          <label>Content</label>
          <textarea id="editContent" style="min-height: 400px;">${escapeHtml(content)}</textarea>
        </div>
      `;

      modalOverlay.classList.add('visible');
      modalOverlay.dataset.type = type;
      modalOverlay.dataset.fileName = fileName;
    }

    function closeModal() {
      modalOverlay.classList.remove('visible');
    }

    async function saveModal() {
      const type = modalOverlay.dataset.type;
      const content = document.getElementById('editContent').value;

      try {
        if (type === 'claudeMd') {
          memoryData.claudeMd.content = content;
          const writable = await memoryData.claudeMd.fileHandle.createWritable();
          await writable.write(content);
          await writable.close();
          showStatus('Saved CLAUDE.md');

        } else if (type === 'memoryFile') {
          const fileName = modalOverlay.dataset.fileName;
          const file = memoryData.memoryFiles.find(f => f.name === fileName);
          if (file) {
            file.content = content;
            const writable = await file.fileHandle.createWritable();
            await writable.write(content);
            await writable.close();
            showStatus('Saved ' + fileName);
          }

        } else if (type === 'dirFile') {
          const dirName = modalOverlay.dataset.dirName;
          const fileName = modalOverlay.dataset.fileName;
          const files = memoryData.memoryDirs[dirName];
          const file = files.find(f => f.name === fileName);
          if (file) {
            file.content = content;
            file.parsed = parseMemoryMarkdown(content);
            const writable = await file.fileHandle.createWritable();
            await writable.write(content);
            await writable.close();
            showStatus('Saved ' + fileName);
          }

        } else if (type === 'newDirFile') {
          const dirName = modalOverlay.dataset.dirName;
          let fileName = document.getElementById('newFileName').value.trim();
          if (!fileName) { showStatus('Please enter a filename'); return; }
          if (!fileName.endsWith('.md')) fileName += '.md';

          const memoryDir = await getMemoryDir(memoryDirHandle);
          const subDir = await memoryDir.getDirectoryHandle(dirName, { create: true });
          const fileHandle = await subDir.getFileHandle(fileName, { create: true });

          const writable = await fileHandle.createWritable();
          await writable.write(content);
          await writable.close();

          memoryData.memoryDirs[dirName].push({
            name: fileName,
            content: content,
            fileHandle: fileHandle,
            dirHandle: subDir,
            parsed: parseMemoryMarkdown(content)
          });

          showStatus('Created ' + fileName);
        }

        closeModal();
        renderMemory();

      } catch (e) {
        showStatus('Error saving: ' + e.message);
      }
    }

    // Memory event listeners
    openMemoryBtn.addEventListener('click', connectProject);
    document.getElementById('openMemoryBtnLarge').addEventListener('click', connectProject);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalSave').addEventListener('click', saveModal);

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Expose functions to onclick handlers
    window.openFileModal = openFileModal;
    window.openNewFileModal = openNewFileModal;
    window.openEditModal = openEditModal;
    window.filterMemoryDirectory = filterMemoryDirectory;
  
    // On load: auto-load if permission is still granted, otherwise arm the button
    (async () => {
      const root = await idbGet('projectRoot').catch(() => null);
      const label = root ? 'Abrir ' + root.name + '/' : 'Conectar pasta strategy/ (só na 1ª vez)';
      ['openBtnLarge', 'openMemoryBtnLarge', 'openTaskBtn', 'openMemoryBtn'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.textContent = label;
      });
      if (root && (await root.queryPermission({ mode: 'readwrite' })) === 'granted') {
        await loadProject(root);
      } else {
        document.getElementById('openBtnLarge')?.focus();
      }
    })();
  </script>
