<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='2' width='24' height='28' rx='4' fill='%23faf9f5' stroke='%23D97757' stroke-width='2'/%3E%3Crect x='8' y='0' width='16' height='5' rx='2.5' fill='%23D97757'/%3E%3Cpath d='M9 13l3 3 5-5' fill='none' stroke='%23D97757' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='20' y='12' width='5' height='2' rx='1' fill='%23c4c4c2'/%3E%3Crect x='9' y='20' width='10' height='2' rx='1' fill='%23c4c4c2'/%3E%3Crect x='9' y='25' width='7' height='2' rx='1' fill='%23c4c4c2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #faf9f5;
      --bg-secondary: #F5F4EF;
      --bg-card: #ffffff;
      --text-primary: #141413;
      --text-secondary: #5c5c5a;
      --text-muted: #8c8c8a;
      --accent: #D97757;
      --accent-hover: #c4684a;
      --border: #e5e4df;
      --border-light: #eeeee9;
      --shadow: rgba(20, 20, 19, 0.04);
      --shadow-hover: rgba(20, 20, 19, 0.08);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      padding: 20px 24px;
      line-height: 1.5;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; color: var(--text-secondary); }

    .header-left {
      display: flex;
      align-items: flex-start;
      gap: 0;
    }

    .view-toggle {
      display: flex;
      gap: 4px;
      background: var(--bg-secondary);
      padding: 4px;
      border-radius: 8px;
      margin-left: 16px;
    }

    .view-toggle button {
      background: transparent;
      border: none;
      padding: 6px 14px;
      font-size: 13px;
      color: var(--text-muted);
      border-radius: 6px;
    }

    .view-toggle button:hover {
      color: var(--text-primary);
      background: transparent;
    }

    .view-toggle button.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: 0 1px 3px var(--shadow);
    }

    .buttons { display: flex; gap: 12px; }

    button {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    button:hover {
      background: var(--bg-secondary);
      border-color: var(--text-muted);
    }

    button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    button.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ===== TASKS STYLES ===== */

    .board {
      display: flex;
      gap: 24px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 24px;
      flex: 1;
      min-height: 0;
    }

    .column {
      background: var(--bg-secondary);
      border-radius: 12px;
      min-width: 340px;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
    }

    .column-header {
      padding: 16px 18px;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
    }

    .column-header:active {
      cursor: grabbing;
    }

    .column.dragging-column {
      opacity: 0.5;
    }

    .column-drop-indicator {
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin: 0 -2px;
      min-height: 100px;
    }

    .column-header .count {
      background: var(--bg-card);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .cards {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 12px;
      min-height: 100px;
    }

    .cards.drag-over {
      background: rgba(217, 119, 87, 0.05);
      border-radius: 8px;
    }

    .task-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: grab;
      transition: all 0.15s ease;
      box-shadow: 0 1px 3px var(--shadow);
      position: relative;
    }

    .task-card:hover {
      box-shadow: 0 4px 12px var(--shadow-hover);
      border-color: var(--border);
    }

    .task-card .add-on-hover {
      display: none;
    }

    .task-card:hover .add-on-hover {
      display: block;
    }

    .task-card .delete-btn {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 6px;
      font-size: 14px;
      line-height: 1;
      border-radius: 4px;
    }

    .task-card:hover .delete-btn {
      display: block;
    }

    .task-card .delete-btn:hover {
      background: var(--bg-secondary);
      color: var(--accent);
    }

    .task-card.dragging {
      opacity: 0.5;
      transform: rotate(2deg);
    }

    .card-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text-primary);
    }

    .card-note {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .card-subtasks {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-light);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .subtask {
      padding: 3px 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      min-width: 18px;
      min-height: 18px;
      flex-shrink: 0;
      border: 2px solid var(--border);
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      cursor: pointer;
      transition: all 0.15s ease;
      background: var(--bg-card);
    }

    .checkbox:hover {
      border-color: var(--accent);
    }

    .checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkbox.checked::after {
      content: '';
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 40px;
      color: var(--text-muted);
    }

    .empty-state button {
      font-size: 16px;
      padding: 14px 28px;
      background: var(--accent);
      border: none;
      color: white;
    }

    .empty-state button:hover {
      background: var(--accent-hover);
    }

    .status-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-primary);
      color: var(--bg-primary);
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s ease;
      box-shadow: 0 4px 20px rgba(20, 20, 19, 0.15);
      z-index: 200;
    }

    .status-bar.visible { opacity: 1; }

    .add-card {
      padding: 12px;
    }

    .add-card button {
      width: 100%;
      background: transparent;
      border: 2px dashed var(--border);
      color: var(--text-muted);
      font-weight: 500;
    }

    .add-card button:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: transparent;
    }

    .new-task-input {
      width: 100%;
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      resize: none;
    }

    .new-task-input:focus {
      outline: none;
    }

    .new-task-input::placeholder {
      color: var(--text-muted);
    }

    /* Scrollbar styling */
    .cards::-webkit-scrollbar,
    .list-view::-webkit-scrollbar {
      width: 6px;
    }

    .cards::-webkit-scrollbar-track,
    .list-view::-webkit-scrollbar-track {
      background: transparent;
    }

    .cards::-webkit-scrollbar-thumb,
    .list-view::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .cards::-webkit-scrollbar-thumb:hover,
    .list-view::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* List View Styles */
    .list-view {
      max-width: 800px;
      margin: 0 auto;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
    }

    .list-section {
      margin-bottom: 28px;
    }

    .list-section.drag-over {
      background: rgba(217, 119, 87, 0.05);
      border-radius: 8px;
      margin: 0 -12px 32px;
      padding: 0 12px;
    }

    .list-section-header {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      padding: 4px 0;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-section-header .section-title {
      cursor: pointer;
    }

    .list-section-header .section-title:hover {
      color: var(--text-primary);
    }

    .list-section-header .count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .list-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      cursor: grab;
      position: relative;
      border-radius: 10px;
      transition: all 0.15s ease;
      box-shadow: 0 1px 3px var(--shadow);
    }

    .list-item:active {
      cursor: grabbing;
    }

    .list-item:hover {
      box-shadow: 0 4px 12px var(--shadow-hover);
      border-color: var(--border);
    }

    .list-item.dragging {
      opacity: 0.5;
      background: var(--bg-secondary);
    }

    .list-item .checkbox {
      margin-top: 2px;
      flex-shrink: 0;
    }

    .list-item-content {
      flex: 1;
      min-width: 0;
    }

    .list-item-title {
      font-size: 15px;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .list-item-title.checked {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .list-item-note {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      cursor: pointer;
    }

    .list-item-note:hover {
      color: var(--text-secondary);
    }

    .list-item-note.add-note {
      font-style: italic;
      display: none;
    }

    .list-item:hover .list-item-note.add-note {
      display: block;
    }

    .list-item-subtasks {
      margin-top: 8px;
      padding-left: 2px;
    }

    .list-item-subtask {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 3px 0;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .list-item-subtask .checkbox {
      width: 16px;
      height: 16px;
      min-width: 16px;
      min-height: 16px;
      margin-top: 1px;
    }

    .list-item-subtask span {
      cursor: pointer;
    }

    .list-item-subtask span:hover {
      color: var(--text-primary);
    }

    .list-item-add-subtask {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
      cursor: pointer;
      padding: 3px 0;
      padding-left: 24px;
      display: none;
    }

    .list-item:hover .list-item-add-subtask {
      display: block;
    }

    .list-item-add-subtask:hover {
      color: var(--accent);
    }

    .list-item-section {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-secondary);
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .list-item-actions {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
    }

    .list-item:hover .list-item-actions {
      display: flex;
      gap: 4px;
    }

    .list-item-actions button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 6px;
      font-size: 14px;
      line-height: 1;
      border-radius: 4px;
    }

    .list-item-actions button:hover {
      background: var(--bg-card);
      color: var(--accent);
    }

    .list-drop-indicator {
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin: 2px -12px;
    }

    .list-add-section {
      margin-top: 16px;
      padding: 16px;
      border: 2px dashed var(--border);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .list-add-section:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .quick-add {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
    }

    .quick-add-input {
      flex: 1;
      background: transparent;
      border: none;
      font-size: 15px;
      color: var(--text-primary);
      font-family: inherit;
      outline: none;
    }

    .quick-add-input::placeholder {
      color: var(--text-muted);
    }

    .quick-add-section {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-secondary);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .quick-add-section:hover {
      border-color: var(--accent);
    }

    .section-picker {
      position: absolute;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 20px var(--shadow-hover);
      padding: 4px;
      z-index: 100;
    }

    .section-picker button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      font-size: 13px;
      background: transparent;
      border: none;
      border-radius: 6px;
    }

    .section-picker button:hover {
      background: var(--bg-secondary);
    }

    /* ===== MEMORY STYLES ===== */

    .memory-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      background: var(--bg-secondary);
      padding: 4px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .memory-tab {
      background: transparent;
      color: var(--text-muted);
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s ease;
      text-transform: capitalize;
    }

    .memory-tab:hover { color: var(--text-primary); }

    .memory-tab.active {
      color: var(--text-primary);
      background: var(--bg-card);
      box-shadow: 0 1px 3px var(--shadow);
    }

    .memory-tab .count {
      background: var(--bg-secondary);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      margin-left: 6px;
      color: var(--text-muted);
    }

    .memory-tab.active .count {
      background: var(--border-light);
    }

    .memory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .memory-flat-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .memory-flat-table th {
      text-align: left;
      padding: 10px 16px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .memory-flat-table td {
      padding: 9px 16px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-primary);
      line-height: 1.4;
    }

    .memory-flat-table td:first-child {
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
      width: 120px;
    }

    .memory-flat-table tr:last-child td {
      border-bottom: none;
    }

    .memory-flat-table tr:hover td {
      background: var(--bg-secondary);
    }

    .memory-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1px 3px var(--shadow);
    }

    .memory-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 12px var(--shadow-hover);
    }

    .memory-card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
    }

    .memory-card-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .memory-card-preview {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .memory-card-fields {
      margin-top: 10px;
      font-size: 12px;
    }

    .memory-card-field {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
    }

    .memory-card-field-label {
      color: var(--text-muted);
      min-width: 80px;
    }

    .memory-card-field-value {
      color: var(--text-secondary);
    }

    .file-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px var(--shadow);
    }

    .file-card-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .file-card-header:hover {
      background: var(--bg-secondary);
    }

    .file-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .file-card-content {
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow-y: auto;
      display: none;
      color: var(--text-secondary);
    }

    .file-card-content.expanded {
      display: block;
    }

    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 16px 24px;
      min-width: 100px;
      box-shadow: 0 1px 3px var(--shadow);
    }

    .stat-value {
      font-size: 28px;
      font-weight: 600;
      color: var(--accent);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: capitalize;
      margin-top: 4px;
    }

    .search-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .add-btn {
      background: transparent;
      border: 2px dashed var(--border);
      color: var(--text-muted);
      padding: 40px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
    }

    .add-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .markdown-content {
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .markdown-content h1 { font-size: 1.4em; margin: 16px 0 8px; color: var(--text-primary); }
    .markdown-content h2 { font-size: 1.2em; margin: 14px 0 6px; color: var(--text-primary); }
    .markdown-content h3 { font-size: 1.1em; margin: 12px 0 4px; color: var(--text-secondary); }
    .markdown-content p { margin: 8px 0; }
    .markdown-content ul, .markdown-content ol { margin: 8px 0 8px 20px; }
    .markdown-content li { margin: 4px 0; }
    .markdown-content code {
      background: var(--bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-primary);
    }
    .markdown-content pre {
      background: var(--bg-secondary);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      border: 1px solid var(--border-light);
    }
    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 13px;
    }
    .markdown-content th, .markdown-content td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-light);
    }
    .markdown-content th {
      background: var(--bg-secondary);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(20, 20, 19, 0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border-radius: 12px;
      width: 90%;
      max-width: 800px;
      max-height: 85vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(20, 20, 19, 0.2);
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .modal-close:hover { color: var(--text-primary); }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .form-group textarea {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      line-height: 1.5;
      min-height: 300px;
      resize: vertical;
    }

    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Tab panel containers */
    .tab-panel {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .tab-panel.active {
      display: flex;
    }

    /* Memory panel scrollable area */
    .memory-content-area {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .memory-content-area::-webkit-scrollbar {
      width: 6px;
    }

    .memory-content-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .memory-content-area::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .memory-content-area::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    .file-card-content::-webkit-scrollbar,
    .modal-body::-webkit-scrollbar {
      width: 6px;
    }

    .file-card-content::-webkit-scrollbar-track,
    .modal-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .file-card-content::-webkit-scrollbar-thumb,
    .modal-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .file-card-content::-webkit-scrollbar-thumb:hover,
    .modal-body::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* File path display */
    .file-path {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }
  
    /* ===== Categories (#tags in task notes) ===== */
    .cat-pill, .owner-pill, .flag-pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; line-height: 1;
      padding: 3px 7px; border-radius: 999px; white-space: nowrap;
    }
    .cat-pill { color: #fff; }
    .owner-pill { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); }
    .owner-pill.andre, .owner-pill.quant { background: #fff4ef; color: #b4532a; border-color: #f2c6b2; }
    .owner-pill.team { background: #ebfbee; color: #2b8a3e; border-color: #b2f2bb; }
    .flag-pill { background: #fff5f5; color: #c92a2a; border: 1px solid #ffc9c9; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 8px 30px; }
    .task-card[data-cat] { border-left: 4px solid var(--cat-color, var(--border)); }

    .view-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
      margin-bottom: 16px; font-size: 13px; color: var(--text-secondary);
    }
    .view-toolbar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .view-toolbar .stat strong { color: var(--text-primary); font-size: 15px; }
    .view-toolbar .stat.clickable { cursor: pointer; user-select: none; transition: all 0.15s ease; }
    .view-toolbar .stat.clickable:hover { border-color: var(--accent); }
    .view-toolbar .stat.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); color: var(--accent); }
    .score-pill { background: #212529; color: #fff; }

    /* ===== Mindmap (estilo MindMeister) ===== */
    .mindmap-view { flex: 1; min-height: 0; display: none; flex-direction: column; }
    .mindmap-scroll { flex: 1; min-height: 0; overflow: auto; background: #fff; border: 1px solid var(--border-light); border-radius: 12px; }
    .mindmap-canvas { position: relative; transform-origin: 0 0; }
    .mindmap-canvas svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
    .mm-node { position: absolute; font-size: 12px; line-height: 1.35; color: #212529; white-space: normal; }
    .mm-node.side-left { text-align: right; }
    .mm-node.has-kids { cursor: pointer; }
    .mm-node.collapsed::after { content: ' ⊕'; color: var(--mm-color); font-weight: 700; }
    .mm-root {
      background: #ffd43b; color: #212529; font-weight: 700; font-size: 16px;
      padding: 8px 18px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.15); white-space: nowrap;
    }
    .mm-cat { font-weight: 700; font-size: 14px; color: var(--mm-color); white-space: nowrap; }
    .mm-group { font-weight: 800; font-size: 15px; color: #fff; background: var(--mm-color); padding: 3px 10px; border-radius: 6px; white-space: nowrap; }
    .mm-task { max-width: 250px; }
    .mm-task.active { font-weight: 600; }
    .mm-task.done, .mm-sub.done { text-decoration: line-through; opacity: .5; }
    .mm-sub { max-width: 270px; font-size: 11px; color: #495057; }
    .mm-node .flag-pill, .mm-node .score-pill { font-size: 9px; padding: 2px 5px; vertical-align: 1px; }
    .mm-zoom { display: inline-flex; gap: 4px; }
    .mm-zoom button { padding: 2px 10px; }

    /* ===== Ranking ===== */
    .rank-view { flex: 1; min-height: 0; overflow: auto; padding-bottom: 24px; }
    .rank-table { width: 100%; border-collapse: collapse; background: var(--bg-card); font-size: 13px; }
    .rank-table th {
      position: sticky; top: 0; z-index: 1; background: var(--bg-secondary); text-align: left;
      font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted);
      padding: 8px 10px; border-bottom: 1px solid var(--border);
    }
    .rank-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
    .rank-table tr.done td { opacity: .5; }
    .rank-table tr:hover td { background: var(--bg-secondary); }
    .rank-num { color: var(--text-muted); font-variant-numeric: tabular-nums; width: 32px; }
    .rank-score { display: flex; align-items: center; gap: 8px; min-width: 120px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .rank-score .bar { flex: 1; height: 6px; background: var(--bg-secondary); border-radius: 3px; overflow: hidden; }
    .rank-score .bar div { height: 100%; border-radius: 3px; }
    .rank-title { border-left: 3px solid var(--cat-color, var(--border)); padding-left: 8px; color: var(--text-primary); font-weight: 500; }
    .rank-table select { font: inherit; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: var(--text-primary); padding: 1px 2px; }
    .rank-why { color: var(--text-secondary); min-width: 220px; outline: none; border-radius: 4px; padding: 2px 4px; }
    .rank-why:focus { background: var(--bg-card); box-shadow: 0 0 0 2px var(--accent); }
    .rank-why:empty::before { content: '+ por quê'; color: var(--text-muted); font-style: italic; }
    .rank-table select.rank-cat-edit {
      color: #fff; border: none; border-radius: 999px; font-size: 11px; font-weight: 600;
      padding: 3px 6px; cursor: pointer; max-width: 210px;
    }
    .rank-table select.rank-cat-edit option { color: var(--text-primary); background: var(--bg-card); }
    .rank-title { display: flex; align-items: baseline; gap: 6px; }
    .rank-title-text { flex: 1; outline: none; border-radius: 4px; padding: 1px 3px; cursor: text; }
    .rank-title-text:hover { background: var(--bg-card); box-shadow: 0 0 0 1px var(--border); }
    .rank-title-text:focus { background: var(--bg-card); box-shadow: 0 0 0 2px var(--accent); }
    .rank-flag {
      flex: none; font-size: 10px; font-weight: 600; line-height: 1; padding: 3px 6px; border-radius: 999px; cursor: pointer;
      border: 1px dashed var(--border); background: transparent; color: var(--text-muted); opacity: .35;
    }
    .rank-table tr:hover .rank-flag { opacity: 1; }
    .rank-subs-toggle {
      display: inline-block; margin: 3px 0 0 30px; font-size: 11px; color: var(--text-muted); cursor: pointer;
      border-radius: 4px; padding: 0 4px; user-select: none;
    }
    .rank-subs-toggle:hover { color: var(--accent); background: var(--bg-card); }
    .rank-subs-toggle.empty { opacity: 0; }
    .rank-table tr:hover .rank-subs-toggle.empty, .rank-subs-toggle.empty:focus-within { opacity: 1; }
    .rank-subs-count { display: inline-block; margin: 3px 0 0 30px; font-size: 11px; color: var(--text-muted); }
    .rank-sub-add.on-hover { display: none; }
    .rank-table tr:hover .rank-sub-add.on-hover, .rank-sub-add.on-hover:focus, .rank-sub-add.on-hover:not(:placeholder-shown) { display: block; }
    .rank-subs { margin: 4px 0 2px 30px; display: flex; flex-direction: column; gap: 2px; }
    .rank-sub { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .rank-sub input[type=checkbox] { margin: 0; cursor: pointer; }
    .rank-sub-text { flex: 1; outline: none; border-radius: 4px; padding: 1px 3px; cursor: text; color: var(--text-secondary); }
    .rank-sub-text:hover { background: var(--bg-card); box-shadow: 0 0 0 1px var(--border); }
    .rank-sub-text:focus { background: var(--bg-card); box-shadow: 0 0 0 2px var(--accent); color: var(--text-primary); }
    .rank-sub.checked .rank-sub-text { text-decoration: line-through; color: var(--text-muted); }
    .rank-sub-del { border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 4px; opacity: 0; }
    .rank-sub:hover .rank-sub-del { opacity: 1; }
    .rank-sub-del:hover { color: #c92a2a; }
    .rank-sub-add { font: inherit; font-size: 12px; border: 1px dashed var(--border); border-radius: 4px; background: transparent; color: var(--text-primary); padding: 2px 6px; margin-top: 2px; width: 100%; max-width: 360px; }
    .rank-sub-add:focus { outline: none; border: 1px solid var(--accent); background: var(--bg-card); }
    .rank-del {
      flex: none; align-self: center; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 12px; line-height: 1;
      padding: 2px 4px; border-radius: 4px; opacity: 0;
    }
    .rank-table tr:hover .rank-del, .rank-del:focus { opacity: 1; }
    .rank-del:hover { color: #c92a2a; background: #fff5f5; }
    .rank-flag.on { opacity: 1; background: #fff5f5; color: #c92a2a; border: 1px solid #ffc9c9; }
    .rank-add {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; padding: 10px 12px;
      background: var(--bg-card); border: 1px dashed var(--border); border-radius: 10px; font-size: 13px;
    }
    .rank-add-label { font-weight: 700; color: var(--accent); }
    .rank-add input[type=text], .rank-add input:not([type]) {
      font: inherit; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card); color: var(--text-primary);
    }
    .rank-add-title { flex: 2 1 260px; }
    .rank-add-why { flex: 1 1 200px; }
    .rank-add select { font: inherit; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: var(--text-primary); padding: 2px; }
    .rank-add select.rank-cat-edit { color: #fff; border: none; border-radius: 999px; font-size: 11px; font-weight: 600; padding: 3px 6px; }
    .rank-add label { display: inline-flex; align-items: center; gap: 4px; color: var(--text-secondary); }
    .rank-cat-menu { position: relative; display: inline-block; margin-left: 6px; text-transform: none; letter-spacing: 0; }
    .rank-cat-toggle {
      font-size: 12px; font-weight: 500; padding: 2px 8px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg-card); color: var(--text-primary); cursor: pointer;
    }
    .rank-cat-toggle.filtered { border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .rank-cat-pop {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 10; min-width: 230px;
      max-height: 60vh; overflow: auto; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 8px 24px var(--shadow-hover); padding: 6px; font-size: 13px; color: var(--text-primary);
    }
    .rank-cat-menu.open .rank-cat-pop { display: block; }
    .rank-cat-pop label { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .rank-cat-pop label:hover { background: var(--bg-secondary); }
    .rank-cat-pop label.group { font-weight: 700; margin-top: 4px; }
    .rank-cat-pop label.sub { padding-left: 24px; }
    .rank-cat-pop label i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
    .rank-cat-actions { display: flex; gap: 6px; padding: 2px 4px 6px; border-bottom: 1px solid var(--border-light); margin-bottom: 4px; }
    .rank-cat-actions button { font-size: 11px; padding: 2px 8px; }
    .score-filter { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); padding: 3px 8px; border-radius: 6px; border: 1px solid transparent; }
    .score-filter.on { border-color: #f08c00; color: var(--text-primary); background: var(--bg-card); }
    .score-filter input[type=range] { width: 120px; accent-color: #f08c00; }
    .score-filter input[type=number] { width: 58px; font: inherit; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: var(--text-primary); padding: 1px 4px; }
    .score-filter button { border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
    .score-filter button:hover { color: #c92a2a; }
    .rank-legend { font-size: 12px; color: var(--text-muted); margin: -6px 0 12px; }

    /* ===== Tabela (status x categoria) ===== */
    .matrix-view { flex: 1; min-height: 0; overflow: auto; padding-bottom: 24px; }
    .matrix-table { border-collapse: separate; border-spacing: 0; min-width: 100%; }
    .matrix-table th, .matrix-table td {
      border-right: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light);
      vertical-align: top; padding: 8px; background: var(--bg-card);
    }
    .matrix-table thead { position: sticky; top: 0; z-index: 2; }
    .matrix-table thead th.group-head {
      min-width: 0; padding: 6px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
      color: #fff; background: var(--cat-color); border-top: none;
    }
    .matrix-table thead th.group-head.empty { background: var(--bg-secondary); }
    .matrix-table thead th {
      text-align: left; min-width: 220px;
      border-top: 4px solid var(--cat-color, var(--border)); background: var(--bg-secondary);
    }
    .matrix-table th.row-head {
      position: sticky; left: 0; z-index: 1; min-width: 110px; background: var(--bg-secondary);
      font-size: 13px; text-align: left;
    }
    .matrix-table thead th.row-head { z-index: 3; border-top-color: transparent; }
    .matrix-col-title { font-size: 13px; font-weight: 700; color: var(--text-primary); }
    .matrix-col-sub { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-top: 2px; }
    .matrix-table td.drop-target { background: var(--bg-secondary); outline: 2px dashed var(--accent); outline-offset: -3px; }
    .matrix-chip {
      border: 1px solid var(--border-light); border-left: 3px solid var(--cat-color, var(--border));
      border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; background: var(--bg-card);
      font-size: 12.5px; cursor: grab; box-shadow: 0 1px 2px var(--shadow);
    }
    .matrix-add {
      font-size: 12px; color: var(--text-muted); padding: 4px 6px; border-radius: 6px; cursor: pointer; opacity: 0;
      transition: opacity .15s ease;
    }
    .matrix-table td:hover .matrix-add { opacity: 1; }
    .matrix-add:hover { background: var(--bg-secondary); color: var(--accent); }
    .matrix-add-input {
      width: 100%; font: inherit; font-size: 12.5px; padding: 6px 8px; border: 2px solid var(--accent);
      border-radius: 6px; outline: none; background: var(--bg-card); color: var(--text-primary);
    }
    .matrix-chip.done { opacity: .5; text-decoration: line-through; }
    .matrix-chip-head { display: flex; align-items: flex-start; gap: 6px; }
    .matrix-chip-head input { margin-top: 2px; cursor: pointer; }
    .matrix-chip-title { flex: 1; color: var(--text-primary); cursor: pointer; }
    .matrix-chip-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .matrix-chip-detail { display: none; margin-top: 6px; color: var(--text-secondary); font-size: 12px; }
    .matrix-chip.open .matrix-chip-detail { display: block; }
    .matrix-chip-detail ul { margin: 4px 0 0 16px; padding: 0; }

</style>

  <header>
    <div class="header-left">
      <svg width="28" height="28" viewBox="0 0 32 32" style="margin-right: 12px; flex-shrink: 0;">
        <rect x="4" y="2" width="24" height="28" rx="4" fill="#faf9f5" stroke="#D97757" stroke-width="2"/>

        <rect x="20" y="12" width="5" height="2" rx="1" fill="#c4c4c2"/>
        <rect x="9" y="20" width="10" height="2" rx="1" fill="#c4c4c2"/>
        <rect x="9" y="25" width="7" height="2" rx="1" fill="#c4c4c2"/>
      </svg>
      <div>
        <h1>Productivity</h1>
        <div id="filePath" class="file-path"></div>
      </div>
      <div class="view-toggle" id="mainTabToggle">
        <button id="tasksTabBtn" class="active">Tasks</button>
        <button id="memoryTabBtn">Memory</button>
      </div>
      <div class="view-toggle" id="taskViewToggle">
        <button id="boardViewBtn" class="active">Board</button>
        <button id="listViewBtn">List</button>
        <button id="matrixViewBtn">Tabela</button>
        <button id="rankViewBtn">Ranking</button>
        <button id="mindmapViewBtn">Mindmap</button>
      </div>
    </div>
    <div class="buttons">
      <button id="openTaskBtn">Select File</button>
      <button id="openMemoryBtn" style="display: none;">Open Folder</button>
      <button id="saveBtn" class="primary" disabled style="display: none;">Save</button>
    </div>
  </header>

  <!-- TASKS TAB PANEL -->
  <div class="tab-panel active" id="tasksPanel">
    <div class="list-view" id="listView" style="display: none;"></div>
    <div class="matrix-view" id="matrixView" style="display: none;"></div>
    <div class="rank-view" id="rankView" style="display: none;"></div>
    <div class="mindmap-view" id="mindmapView" style="display: none;"></div>
    <div class="board" id="board">
      <div class="empty-state" id="boardEmptyState" style="width: 100%;">
        <p style="margin-bottom: 24px; font-size: 18px; font-weight: 600; color: var(--text-primary);">Conecte a pasta strategy/ (lê o tasks.csv)</p>
        <button id="openBtnLarge">Conectar pasta strategy/</button>
      </div>
    </div>
  </div>

  <!-- MEMORY TAB PANEL -->
  <div class="tab-panel" id="memoryPanel">
    <div id="memoryEmptyState" class="empty-state">
      <p style="margin-bottom: 24px; font-size: 18px; font-weight: 600; color: var(--text-primary);">Select your project folder</p>
      <button id="openMemoryBtnLarge">Select Folder</button>
    </div>
    <div id="memoryMainContent" style="display: none; flex-direction: column; min-height: 0; flex: 1;">
      <div class="memory-tabs" id="memoryTabsContainer"></div>
      <div class="memory-content-area">
        <div id="memoryContentContainer"></div>
      </div>
    </div>
  </div>

  <!-- MODAL (shared for memory) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Edit</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button id="modalCancel">Cancel</button>
        <button id="modalSave" class="primary">Save</button>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status"></div>

  <script>
      // Remembered project folder (IndexedDB) so one click loads everything
      function idbOpen() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open('strategy-dashboard', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('handles');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      async function idbGet(key) {
        const db = await idbOpen();
        return new Promise((resolve, reject) => {
          const req = db.transaction('handles').objectStore('handles').get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      async function idbSet(key, value) {
        const db = await idbOpen();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('handles', 'readwrite');
          tx.objectStore('handles').put(value, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      async function loadProject(root) {
        projectRoot = root;
        try {
          await loadTaskHandle(await root.getFileHandle(TASKS_FILE));
        } catch (e) { showStatus(TASKS_FILE + ' não encontrado em ' + root.name); }
        await loadMemoryDirectory(root);
      }

      // Shift+click picks a different folder
      async function connectProject(e) {
        try {
          let root = e && e.shiftKey ? null : await idbGet('projectRoot').catch(() => null);
          if (root && (await root.requestPermission({ mode: 'readwrite' })) !== 'granted') root = null;
          if (!root) {
            root = await window.showDirectoryPicker({ id: 'strategy', mode: 'readwrite' });
            await idbSet('projectRoot', root).catch(() => {});
          }
          await loadProject(root);
        } catch (err) {
          if (err.name !== 'AbortError') { showStatus('Error: ' + err.message); }
        }
      }

      // Memory lives in .claude/memory/ (falls back to memory/ at the root)
      async function getMemoryDir(root) {
        try {
          const claudeDir = await root.getDirectoryHandle('.claude');
          return await claudeDir.getDirectoryHandle('memory');
        } catch (e) {
          return await root.getDirectoryHandle('memory');
        }
      }

    // ===== SHARED STATE =====
    let activeMainTab = 'tasks'; // 'tasks' or 'memory'

    const statusEl = document.getElementById('status');
    const filePathEl = document.getElementById('filePath');

    function showStatus(msg) {
      statusEl.textContent = msg;
      statusEl.classList.add('visible');
      setTimeout(() => statusEl.classList.remove('visible'), 2000);
    }

    // ===== MAIN TAB SWITCHING =====
    const tasksTabBtn = document.getElementById('tasksTabBtn');
    const memoryTabBtn = document.getElementById('memoryTabBtn');
    const tasksPanel = document.getElementById('tasksPanel');
    const memoryPanel = document.getElementById('memoryPanel');
    const taskViewToggle = document.getElementById('taskViewToggle');
    const openTaskBtn = document.getElementById('openTaskBtn');
    const openMemoryBtn = document.getElementById('openMemoryBtn');
    const saveBtn = document.getElementById('saveBtn');

    function switchMainTab(tab) {
      activeMainTab = tab;

      tasksTabBtn.classList.toggle('active', tab === 'tasks');
      memoryTabBtn.classList.toggle('active', tab === 'memory');

      tasksPanel.classList.toggle('active', tab === 'tasks');
      memoryPanel.classList.toggle('active', tab === 'memory');

      // Show/hide view toggle for tasks
      taskViewToggle.style.display = tab === 'tasks' ? 'flex' : 'none';

      // Show/hide appropriate buttons
      openTaskBtn.style.display = tab === 'tasks' ? 'inline-flex' : 'none';
      openMemoryBtn.style.display = tab === 'memory' ? 'inline-flex' : 'none';
      saveBtn.style.display = tab === 'tasks' ? 'inline-flex' : 'none';

      // Update file path display
      if (tab === 'tasks') {
        filePathEl.textContent = taskFileHandle ? taskFileName : '';
      } else {
        filePathEl.textContent = memoryDirHandle ? memoryDirHandle.name : '';
      }
    }

    tasksTabBtn.addEventListener('click', () => switchMainTab('tasks'));
    memoryTabBtn.addEventListener('click', () => switchMainTab('memory'));

    // ============================================================
    // ===== TASKS FUNCTIONALITY =====
    // ============================================================

    let taskFileHandle = null;
    let taskFileName = '';
    let sections = [];
    let tasks = {};
    let hasChanges = false;
    let currentView = 'board';
    let quickAddSection = null;

    const board = document.getElementById('board');
    const listView = document.getElementById('listView');
    const listViewBtn = document.getElementById('listViewBtn');
    const boardViewBtn = document.getElementById('boardViewBtn');

    function taskSectionId(name) {
      return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    // ===== tasks.csv: uma linha por task (e uma por subtarefa, com parent = id da task) =====
    // Colunas: id, parent, status, title, frente, dono, urgente, i, u, e, por_que, nota, done.
    // Arquivo em Latin-1, sem BOM. O score não é gravado: sai de I/U/E. Internamente frente/dono/urgente viram tags na nota,
    // que é o que as abas já usam.
    const TASKS_FILE = 'tasks.csv';
    const CSV_COLUMNS = ['id', 'parent', 'status', 'title', 'frente', 'dono', 'urgente', 'i', 'u', 'e', 'por_que', 'nota', 'done'];
    const DEFAULT_SECTIONS = ['Someday', 'Active', 'Waiting On', 'Done'];

    function parseCsv(text) {
      const rows = [];
      let row = [], field = '', quoted = false;
      text = text.replace(/^\uFEFF/, '');
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false;
          } else field += ch;
        } else if (ch === '"') quoted = true;
        else if (ch === ',') { row.push(field); field = ''; }
        else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(field); field = '';
          rows.push(row); row = [];
        } else field += ch;
      }
      if (field !== '' || row.length) { row.push(field); rows.push(row); }
      return rows.filter(r => r.some(c => c.trim() !== ''));
    }
    // O arquivo é Latin-1 (ISO-8859-1): acentos sim, símbolos não. Símbolos comuns viram texto/ASCII
    // e o resto fora do Latin-1 é removido antes de gravar.
    let csvSanitized = false;
    function toLatin1Text(v) {
      const out = String(v)
        .replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014]/g, '-').replace(/\u2026/g, '...')
        .replace(/\u21b3\s*/g, 'origem: ').replace(/\s*\u203a\s*/g, ' - ').replace(/\s*\u2194\s*/g, ' com ').replace(/\s*\u2192\s*/g, ' para ')
        .replace(/[^\x00-\x7F\xA0-\xFF]/g, '')
        .replace(/^\s*-\s+/, '').replace(/ {2,}/g, ' ').trim();
      if (out !== String(v).trim()) csvSanitized = true;
      return out;
    }
    function latin1Bytes(str) {
      const bytes = new Uint8Array(str.length);
      for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
      return bytes;
    }
    // Lê Latin-1; se o arquivo vier em UTF-8 (ex.: salvo por uma planilha), aceita e a próxima gravação converte
    async function readTasksFile(file) {
      const buf = await file.arrayBuffer();
      try { return new TextDecoder('utf-8', { fatal: true }).decode(buf).replace(/^\uFEFF/, ''); }
      catch (e) { return new TextDecoder('iso-8859-1').decode(buf); }
    }
    function csvField(v) {
      v = v == null ? '' : toLatin1Text(v);
      return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }

    function parseTasksCsv(content) {
      const rows = parseCsv(content);
      const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
      const get = (r, name) => { const i = head.indexOf(name); return i >= 0 ? (r[i] || '').trim() : ''; };
      const resultSections = [], resultTasks = {}, resultPriorities = {}, byId = {};
      const ensureSection = name => {
        const id = taskSectionId(name);
        if (!resultTasks[id]) { resultSections.push({ id, name }); resultTasks[id] = []; }
        return id;
      };
      DEFAULT_SECTIONS.forEach(ensureSection);
      const subRows = [];
      rows.forEach(r => {
        if (get(r, 'parent')) { subRows.push(r); return; }
        const title = get(r, 'title');
        if (!title) return;
        const sectionId = ensureSection(get(r, 'status') || 'Someday');
        const dono = get(r, 'dono'), frente = get(r, 'frente').replace(/^#/, '');
        const note = [get(r, 'nota'), dono ? `[${dono}]` : '', frente ? '#' + frente : '', get(r, 'urgente') ? '#urgente' : '']
          .filter(Boolean).join(' ');
        const task = {
          id: Date.now() + Math.random(), uid: get(r, 'id'), title, note,
          checked: isDoneSection(sectionId) || !!get(r, 'done'), subtasks: [], section: sectionId,
        };
        resultTasks[sectionId].push(task);
        if (task.uid) byId[task.uid] = task;
        const [i, u, e] = ['i', 'u', 'e'].map(k => get(r, k));
        if ([i, u, e].every(x => /^[1-5]$/.test(x))) resultPriorities[priorityKey(title)] = { title, i: +i, u: +u, e: +e, why: get(r, 'por_que') };
      });
      subRows.forEach(r => {
        const parent = byId[get(r, 'parent')];
        if (parent && get(r, 'title')) parent.subtasks.push({ text: get(r, 'title'), checked: !!get(r, 'done') });
      });
      return { sections: resultSections, tasks: resultTasks, priorities: resultPriorities };
    }

    // Separa da nota interna o que vira coluna: frente (#tag), dono ([...]) e #urgente
    function noteColumns(task) {
      const cat = taskCategory(task);
      const frente = cat === NO_CATEGORY ? '' : cat;
      let nota = task.note || '';
      const dono = nota.match(/\[([^\]]+)\]/);
      if (dono) nota = nota.replace(dono[0], '');
      if (frente) nota = nota.replace(new RegExp('#' + frente.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\p{L}\\p{N}_/-])', 'iu'), '');
      nota = nota.replace(/#urgente(?![\p{L}\p{N}_\/-])/giu, '');
      return { frente, dono: dono ? dono[1].trim() : '', urgente: taskFlags(task).includes('urgente'), nota: nota.replace(/\s{2,}/g, ' ').trim() };
    }

    function tasksToCsv() {
      const all = sections.flatMap(sec => tasks[sec.id] || []);
      let next = Math.max(0, ...all.map(t => parseInt(t.uid, 10) || 0)) + 1;
      const seen = new Set();
      const lines = [CSV_COLUMNS.join(',')];
      sections.forEach(sec => (tasks[sec.id] || []).forEach(t => {
        if (!t.uid || seen.has(String(t.uid))) t.uid = String(next++);
        seen.add(String(t.uid));
        const c = noteColumns(t);
        const p = priorityOf(t);
        lines.push([t.uid, '', sec.name, t.title, c.frente, c.dono, c.urgente ? 'x' : '',
          p ? p.i : '', p ? p.u : '', p ? p.e : '', p ? p.why || '' : '', c.nota, t.checked ? 'x' : ''].map(csvField).join(','));
        t.subtasks.forEach((st, k) => {
          lines.push([`${t.uid}.${k + 1}`, t.uid, sec.name, st.text, '', '', '', '', '', '', '', '', st.checked ? 'x' : ''].map(csvField).join(','));
        });
      }));
      return lines.join('\n') + '\n';
    }

    function createCard(task) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.draggable = true;
      card.dataset.id = task.id;
      const cat = taskCategory(task);
      if (cat !== NO_CATEGORY) {
        card.dataset.cat = cat;
        card.style.setProperty('--cat-color', categoryColor(cat));
      }

      let html = `
        <div style="display: flex; align-items: flex-start; gap: 12px;">
          <button class="delete-btn" data-action="delete" title="Delete task">&times;</button>
          <span class="checkbox ${task.checked ? 'checked' : ''}" data-action="toggle"></span>
          <div class="card-title" data-action="edit-title">${escapeHtml(task.title)}</div>
        </div>
      `;
      const pills = taskPills(task);
      if (pills) html += `<div class="card-tags">${pills}</div>`;

      if (task.note && cleanNote(task.note)) {
        html += `<div class="card-note" data-action="edit-note" style="cursor: pointer; margin-left: 30px;">${escapeHtml(cleanNote(task.note))}</div>`;
      } else if (task.note) {
        html += `<div class="card-note add-on-hover" data-action="edit-note" style="cursor: pointer; margin-left: 30px; font-style: italic;">+ Edit note / tags</div>`;
      } else {
        html += `<div class="card-note add-on-hover" data-action="edit-note" style="cursor: pointer; margin-left: 30px; font-style: italic;">+ Add note</div>`;
      }

      if (task.subtasks.length > 0) {
        html += '<div class="card-subtasks" style="margin-left: 30px;">';
        task.subtasks.forEach((st, idx) => {
          html += `<div class="subtask">
            <span class="checkbox ${st.checked ? 'checked' : ''}" data-action="toggle-sub" data-idx="${idx}" style="width: 16px; height: 16px; min-width: 16px; min-height: 16px;"></span>
            <span data-action="edit-subtask" data-idx="${idx}" style="cursor: pointer;">${escapeHtml(st.text)}</span>
          </div>`;
        });
        html += `<div class="subtask add-on-hover" data-action="add-subtask" style="color: var(--text-muted); cursor: pointer; font-style: italic; padding-left: 24px;">+ Add subtask</div>`;
        html += '</div>';
      } else {
        html += `<div class="card-subtasks add-on-hover" style="margin-left: 30px;">
          <div class="subtask" data-action="add-subtask" style="color: var(--text-muted); cursor: pointer; font-style: italic;">+ Add subtask</div>
        </div>`;
      }

      card.innerHTML = html;

      card.addEventListener('dragstart', (e) => {
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', task.id);
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
      });

      card.addEventListener('click', (e) => {
        const action = e.target.dataset.action;
        if (action === 'toggle') {
          setTaskChecked(task, !task.checked);
          markChanged();
          renderTasks();
        } else if (action === 'toggle-sub') {
          const idx = parseInt(e.target.dataset.idx);
          task.subtasks[idx].checked = !task.subtasks[idx].checked;
          markChanged();
          renderTasks();
        } else if (action === 'edit-title') {
          startEditingTitle(e.target, task);
        } else if (action === 'edit-note') {
          startEditingNote(e.target, task);
        } else if (action === 'edit-subtask') {
          const idx = parseInt(e.target.dataset.idx);
          startEditingSubtask(e.target, task, idx);
        } else if (action === 'add-subtask') {
          startAddingSubtask(e.target, task);
        } else if (action === 'delete') {
          deleteTask(task);
        }
      });

      return card;
    }

    function startEditingTitle(titleEl, task) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = task.title;
      input.style.cssText = 'width: 100%; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 6px; padding: 6px 10px; color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none;';

      titleEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const newTitle = input.value.trim();
        if (newTitle && newTitle !== task.title) {
          task.title = newTitle;
          markChanged();
        }
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function startEditingNote(noteEl, task) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = task.note || '';
      input.placeholder = 'Add a note...';
      input.style.cssText = 'width: 100%; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 6px; padding: 4px 8px; color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none;';

      noteEl.replaceWith(input);
      input.focus();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        task.note = input.value.trim();
        markChanged();
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function startEditingSubtask(subtaskEl, task, idx) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = task.subtasks[idx].text;
      input.style.cssText = 'width: calc(100% - 30px); background: var(--bg-card); border: 2px solid var(--accent); border-radius: 4px; padding: 2px 6px; color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none;';

      subtaskEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const newText = input.value.trim();
        if (newText) { task.subtasks[idx].text = newText; }
        else { task.subtasks.splice(idx, 1); }
        markChanged();
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function startAddingSubtask(el, task) {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'New subtask...';
      input.style.cssText = 'width: calc(100% - 10px); background: var(--bg-card); border: 2px solid var(--accent); border-radius: 4px; padding: 2px 6px; color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none;';

      el.replaceWith(input);
      input.focus();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const text = input.value.trim();
        if (text) { task.subtasks.push({ text, checked: false }); markChanged(); }
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function startEditingColumnTitle(titleEl, colId) {
      const section = sections.find(s => s.id === colId);
      if (!section) return;

      const input = document.createElement('input');
      input.type = 'text';
      input.value = section.name;
      input.style.cssText = 'width: 180px; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 6px; padding: 4px 10px; color: var(--text-primary); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-family: inherit; outline: none;';

      titleEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const newName = input.value.trim();
        if (newName && newName !== section.name) {
          const oldId = section.id;
          section.name = newName;
          const newId = taskSectionId(newName);
          if (newId !== oldId) {
            tasks[newId] = tasks[oldId] || [];
            delete tasks[oldId];
            tasks[newId].forEach(t => t.section = newId);
            section.id = newId;
          }
          markChanged();
        }
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function createColumn(id, title, items) {
      const col = document.createElement('div');
      col.className = 'column';
      col.innerHTML = `
        <div class="column-header">
          <span class="column-title" data-section-id="${id}" style="cursor: pointer;">${escapeHtml(title)}</span>
          <span class="count">${items.length}</span>
        </div>
        <div class="cards" data-column="${id}"></div>
        <div class="add-card">
          <button data-add="${id}">+ Add task</button>
        </div>
      `;

      col.querySelector('.column-title').addEventListener('click', (e) => {
        if (!col.dragging) { startEditingColumnTitle(e.target, id); }
      });

      const header = col.querySelector('.column-header');
      header.draggable = true;

      header.addEventListener('dragstart', (e) => {
        e.stopPropagation();
        col.classList.add('dragging-column');
        e.dataTransfer.setData('text/column', id);
        e.dataTransfer.effectAllowed = 'move';
      });

      header.addEventListener('dragend', () => {
        col.classList.remove('dragging-column');
        board.querySelectorAll('.column-drop-indicator').forEach(el => el.remove());
      });

      col.addEventListener('dragover', (e) => {
        if (e.dataTransfer.types.includes('text/column')) {
          e.preventDefault();
          e.stopPropagation();
          board.querySelectorAll('.column-drop-indicator').forEach(el => el.remove());
          const indicator = document.createElement('div');
          indicator.className = 'column-drop-indicator';
          const rect = col.getBoundingClientRect();
          if (e.clientX < rect.left + rect.width / 2) { col.before(indicator); }
          else { col.after(indicator); }
        }
      });

      col.addEventListener('drop', (e) => {
        if (e.dataTransfer.types.includes('text/column')) {
          e.preventDefault();
          e.stopPropagation();
          const fromId = e.dataTransfer.getData('text/column');
          const toId = id;
          if (fromId !== toId) {
            const rect = col.getBoundingClientRect();
            const insertBefore = e.clientX < rect.left + rect.width / 2;
            moveSection(fromId, toId, insertBefore);
          }
          board.querySelectorAll('.column-drop-indicator').forEach(el => el.remove());
        }
      });

      const cardsContainer = col.querySelector('.cards');
      items.forEach(task => { cardsContainer.appendChild(createCard(task)); });

      const getDropPosition = (e) => {
        const allCards = [...cardsContainer.querySelectorAll('.task-card')];
        const visibleCards = allCards.filter(c => !c.classList.contains('dragging'));
        let insertBeforeCard = null;
        let dropIndex = visibleCards.length;
        for (let i = 0; i < visibleCards.length; i++) {
          const rect = visibleCards[i].getBoundingClientRect();
          if (e.clientY < rect.top + rect.height / 2) {
            insertBeforeCard = visibleCards[i];
            dropIndex = i;
            break;
          }
        }
        return { insertBeforeCard, dropIndex };
      };

      const showDropIndicator = (e) => {
        col.querySelectorAll('.drop-indicator').forEach(el => el.remove());
        const { insertBeforeCard } = getDropPosition(e);
        const indicator = document.createElement('div');
        indicator.className = 'drop-indicator';
        indicator.style.cssText = 'height: 3px; background: var(--accent); border-radius: 2px; margin: 5px 0;';
        if (insertBeforeCard) { cardsContainer.insertBefore(indicator, insertBeforeCard); }
        else { cardsContainer.appendChild(indicator); }
      };

      col.addEventListener('dragover', (e) => {
        e.preventDefault();
        cardsContainer.classList.add('drag-over');
        showDropIndicator(e);
      });

      col.addEventListener('dragleave', (e) => {
        if (!col.contains(e.relatedTarget)) {
          cardsContainer.classList.remove('drag-over');
          col.querySelectorAll('.drop-indicator').forEach(el => el.remove());
        }
      });

      col.addEventListener('drop', (e) => {
        e.preventDefault();
        cardsContainer.classList.remove('drag-over');
        col.querySelectorAll('.drop-indicator').forEach(el => el.remove());
        const taskId = parseFloat(e.dataTransfer.getData('text/plain'));
        const { dropIndex } = getDropPosition(e);
        moveTask(taskId, id, dropIndex);
      });

      col.querySelector(`[data-add="${id}"]`).addEventListener('click', () => {
        addNewTask(id, col.querySelector('.cards'));
      });

      return col;
    }

    function addNewTask(sectionId, container) {
      const existing = container.querySelector('.new-task-input');
      if (existing) return;

      const input = document.createElement('textarea');
      input.className = 'new-task-input';
      input.placeholder = 'What needs to be done?';
      input.rows = 2;
      container.appendChild(input);
      input.focus();

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const title = input.value.trim();
          if (title) {
            if (!tasks[sectionId]) tasks[sectionId] = [];
            tasks[sectionId].push({
              id: Date.now() + Math.random(),
              title,
              note: '',
              checked: isDoneSection(sectionId),
              subtasks: [],
              section: sectionId
            });
            markChanged();
            renderTasks();
          } else { input.remove(); }
        } else if (e.key === 'Escape') { input.remove(); }
      });

      input.addEventListener('blur', () => { setTimeout(() => input.remove(), 100); });
    }

    function moveSection(fromId, toId, insertBefore) {
      const fromIdx = sections.findIndex(s => s.id === fromId);
      const toIdx = sections.findIndex(s => s.id === toId);
      if (fromIdx === -1 || toIdx === -1) return;
      const [section] = sections.splice(fromIdx, 1);
      let newIdx = sections.findIndex(s => s.id === toId);
      if (!insertBefore) newIdx++;
      sections.splice(newIdx, 0, section);
      markChanged();
      renderTasks();
    }

    function moveTask(taskId, toSectionId, dropIndex = -1) {
      let task = null;
      for (const section of sections) {
        const sectionTasks = tasks[section.id] || [];
        const idx = sectionTasks.findIndex(t => t.id === taskId);
        if (idx !== -1) {
          task = sectionTasks.splice(idx, 1)[0];
          break;
        }
      }
      if (!task) return;
      if (isDoneSection(toSectionId) && task.section !== toSectionId) task.prevSection = task.section;
      task.section = toSectionId;
      task.checked = isDoneSection(toSectionId);
      if (!tasks[toSectionId]) tasks[toSectionId] = [];
      if (dropIndex >= 0 && dropIndex <= tasks[toSectionId].length) {
        tasks[toSectionId].splice(dropIndex, 0, task);
      } else {
        tasks[toSectionId].push(task);
      }
      markChanged();
      renderTasks();
    }

    function deleteTask(task) {
      if (!confirm(`Delete "${task.title}"?`)) return;
      for (const section of sections) {
        const sectionTasks = tasks[section.id] || [];
        const idx = sectionTasks.findIndex(t => t.id === task.id);
        if (idx !== -1) { sectionTasks.splice(idx, 1); break; }
      }
      markChanged();
      renderTasks();
    }

    let saveTimeout = null;
    let lastModified = 0;
    let watchInterval = null;
    let isSaving = false;
    let changeSeq = 0;
    let writeChain = Promise.resolve();

    function markChanged() {
      hasChanges = true;
      changeSeq++;
      saveBtn.disabled = false;
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(autoSave, 500);
    }

    // Gravações em fila: Ranking (scores) e demais abas (tasks) escrevem o mesmo tasks.csv
    function writeTasksFile() {
      writeChain = writeChain.then(async () => {
        if (!taskFileHandle) return;
        isSaving = true;
        const seq = changeSeq;
        try {
          csvSanitized = false;
          const csv = tasksToCsv();
          const writable = await taskFileHandle.createWritable();
          await writable.write(latin1Bytes(csv));
          await writable.close();
          lastModified = (await taskFileHandle.getFile()).lastModified;
          if (seq === changeSeq) { hasChanges = false; saveBtn.disabled = true; }
          // Algum texto perdeu símbolos ao gravar: recarrega para a tela mostrar o que ficou no arquivo
          if (csvSanitized && seq === changeSeq) { applyTasksCsv(csv); renderTasks(); }
          showStatus('Saved');
        } catch (e) {
          showStatus('Save failed: ' + e.message);
        }
        isSaving = false;
      });
      return writeChain;
    }

    async function autoSave() {
      if (!taskFileHandle || !hasChanges) return;
      await writeTasksFile();
    }

    function applyTasksCsv(content) {
      const result = parseTasksCsv(content);
      sections = result.sections;
      tasks = result.tasks;
      priorities = result.priorities;
      return reconcileDone();
    }

    async function checkForExternalChanges() {
      if (!taskFileHandle || hasChanges || isSaving) return;
      try {
        const file = await taskFileHandle.getFile();
        if (file.lastModified > lastModified) {
          lastModified = file.lastModified;
          if (applyTasksCsv(await readTasksFile(file))) markChanged();
          renderTasks();
          showStatus('Reloaded');
        }
      } catch (e) { console.log('Watch error:', e); }
    }

    function startWatching() {
      if (watchInterval) clearInterval(watchInterval);
      watchInterval = setInterval(checkForExternalChanges, 1000);
    }

    function stopWatching() {
      if (watchInterval) { clearInterval(watchInterval); watchInterval = null; }
    }

    function renderTasks() {
      if (currentView === 'board') { renderBoard(); }
      else if (currentView === 'matrix') { renderMatrix(); }
      else if (currentView === 'rank') { renderRanking(); }
      else if (currentView === 'mindmap') { renderMindmap(); }
      else { renderList(); }
    }

        // Drag-and-drop handlers for section
        const getDropPosition = (e, container) => {
          const items = [...container.querySelectorAll('.list-item:not(.dragging)')];
          let insertBeforeEl = null;
          let dropIndex = items.length;
          for (let i = 0; i < items.length; i++) {
            const rect = items[i].getBoundingClientRect();
            if (e.clientY < rect.top + rect.height / 2) {
              insertBeforeEl = items[i];
              dropIndex = i;
              break;
            }
          }
          return { insertBeforeEl, dropIndex };
        };

        const showDropIndicator = (e) => {
          tasksContainer.querySelectorAll('.list-drop-indicator').forEach(el => el.remove());
          const { insertBeforeEl } = getDropPosition(e, tasksContainer);
          const indicator = document.createElement('div');
          indicator.className = 'list-drop-indicator';
          if (insertBeforeEl) { tasksContainer.insertBefore(indicator, insertBeforeEl); }
          else { tasksContainer.appendChild(indicator); }
        };

        sectionEl.addEventListener('dragover', (e) => {
          e.preventDefault();
          sectionEl.classList.add('drag-over');
          showDropIndicator(e);
        });

        sectionEl.addEventListener('dragleave', (e) => {
          if (!sectionEl.contains(e.relatedTarget)) {
            sectionEl.classList.remove('drag-over');

          }
        });

        sectionEl.addEventListener('drop', (e) => {
          e.preventDefault();
          sectionEl.classList.remove('drag-over');
          tasksContainer.querySelectorAll('.list-drop-indicator').forEach(el => el.remove());
          const taskId = parseFloat(e.dataTransfer.getData('text/plain'));
          if (!taskId) return;
          const { dropIndex } = getDropPosition(e, tasksContainer);
          moveTask(taskId, section.id, dropIndex);
        });

        listView.appendChild(sectionEl);

      const addSectionBtn = document.createElement('div');

    function startEditingListSectionTitle(titleEl, section) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = section.name;
      input.style.cssText = 'width: 200px; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 6px; padding: 4px 10px; color: var(--text-primary); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-family: inherit; outline: none;';

      titleEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const newName = input.value.trim();
        if (newName && newName !== section.name) {
          const oldId = section.id;
          section.name = newName;
          const newId = taskSectionId(newName);
          if (newId !== oldId) {
            tasks[newId] = tasks[oldId] || [];
            delete tasks[oldId];
            tasks[newId].forEach(t => t.section = newId);
            section.id = newId;
          }
          markChanged();
        }
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function startAddingListSection(btn) {

      input.type = 'text';
      input.placeholder = 'Section name...';
      input.style.cssText = 'width: 100%; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 8px; padding: 12px 16px; color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none; text-align: left;';
